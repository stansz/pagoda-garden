<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pixel garden — six cities, one view</title>
<link rel="stylesheet" href="city/city.css">
</head>
<body>
<canvas id="scene"></canvas>

<a id="gardenLink" href="./voxel-garden/" aria-label="Enter the garden">
  <span class="hint" aria-hidden="true">enter the garden</span>
</a>

<button id="walkLight" aria-label="Follow the light across the water" title="A light across the water" hidden></button>

<div id="cityMenu" hidden>
  <button data-city="vancouver" aria-pressed="true">Vancouver</button>
  <button data-city="toronto" aria-pressed="false">Toronto</button>
  <button data-city="hawaii" aria-pressed="false">Hawai&lsquo;i</button>
  <button data-city="hongkong" aria-pressed="false">Hong Kong</button>
  <button data-city="amsterdam" aria-pressed="false">Amsterdam</button>
  <button data-city="sydney" aria-pressed="false">Sydney</button>
</div>
<div id="info">
  <div id="infoHead" role="button" tabindex="0" aria-expanded="true" title="Location, weather and time">
    <span id="infoPlace">Vancouver</span>
    <span id="infoClock">--:--</span>
    <button id="infoRefresh" aria-label="Refresh weather" title="Refresh weather now">&#8635;</button>
    <span class="chev" aria-hidden="true">&#9660;</span>
  </div>
  <div id="infoSum"><span id="infoCondS">—</span><span id="infoTempS"></span><span id="infoSeasonS" class="muted"></span></div>
  <div id="infoBody">
    <div class="row"><span id="infoCond">Clear sky</span><span id="infoTemp"></span></div>
    <div class="row muted" id="infoSeason"></div>
    <div class="row muted" id="infoMeta"></div>
    <div class="row muted" id="infoScene" hidden></div>
    <div class="ctl"><span class="lbl">city</span>
      <button id="cityBtn" aria-haspopup="true" aria-expanded="false" title="Change city">Vancouver &#9662;</button></div>
    <div class="ctl" style="margin-bottom:2px"><span class="lbl">sound</span>
      <button id="snd" aria-pressed="false" title="Ambient sound">sound</button>
      <input id="vol" type="range" min="0" max="1" step="0.01" value="0.18" aria-label="Volume"></div>
  </div>
</div>

<div id="focus">
  <div id="focusPanel" role="dialog" aria-label="Focus timer" hidden>
    <div class="fp-top"><span id="focusKind">focus</span><span id="focusRounds" aria-label="Round 1 of 4"></span></div>
    <span id="focusLeft">50m</span>
    <div id="focusLens" role="group" aria-label="Session length">
      <button data-len="25" aria-pressed="false">25m</button>
      <button data-len="50" aria-pressed="true">50m</button>
    </div>
    <div id="focusCtl">
      <button id="focusPause">pause</button>
      <button id="focusMore" title="Add 5 minutes">+5m</button>
    </div>
    <button id="focusGo">start</button>
    <label id="focusAuto"><input type="checkbox" id="focusAutoBox"> auto-start next focus</label>
    <span id="focusNote"></span>
  </div>
  <button id="focusPill" aria-haspopup="dialog" aria-expanded="false" data-kind="idle">
    <span class="ico" aria-hidden="true">&#9719;</span><span id="focusPillText">focus</span>
  </button>
</div>
<div id="walk" role="dialog" aria-modal="true" aria-labelledby="walkPlace" hidden>
  <div id="walkPanel">
    <div id="walkTop">
      <span id="walkPlace"></span>
      <button id="walkClose" aria-label="Close">&times;</button>
    </div>
    <div id="walkTabs" role="group" aria-label="Walk views">
      <button data-walk-tab="story" aria-pressed="true">story</button>
      <button data-walk-tab="satchel" aria-pressed="false">satchel</button>
      <button data-walk-tab="journal" aria-pressed="false">journal</button>
    </div>
    <div id="walkBody" aria-live="polite"></div>
    <div id="walkChoices"></div>
  </div>
</div>
<div id="focusLine" aria-hidden="true" hidden></div>

<script src="shared/time.js"></script>
<script src="shared/weather.js"></script>
<script src="shared/audio.js"></script>
<script src="city/core.js"></script>
<script src="city/draw.js"></script>
<script src="city/build.js"></script>
<script src="city/cities/vancouver.js"></script>
<script src="city/cities/toronto.js"></script>
<script src="city/cities/hawaii.js"></script>
<script src="city/cities/hongkong.js"></script>
<script src="city/cities/amsterdam.js"></script>
<script src="city/cities/sydney.js"></script>
<script src="city/trees.js"></script>
<script src="city/island.js"></script>
<script src="city/frame.js"></script>
<script src="city/audio.js"></script>
<script src="city/ui.js"></script>
<script src="city/focus.js"></script>
<script src="city/walk.js"></script>
<script src="city/stories/vancouver.js"></script>
<script src="city/menu.js"></script>
<script src="city/pixel.js"></script>
</body>
</html>
