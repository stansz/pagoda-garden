    ramp.push(t < 0.4 ? mixArr(wc.hi, mid, t / 0.4)
                      : mixArr(mid, wc.lo, (t - 0.4) / 0.6));
  }
  for(let y = 0; y < h; y++){
    const t = Math.pow(y / h, 1.15);
    let v = t * (K - 1);
    let i = Math.floor(v), f = v - i;
    if(i >= K - 1){ i = K - 2; f = 1; }
    const rowOff = (y & 3) << 2;
    for(let x = 0; x < BW; x++){
      const idx = f > BAYER[rowOff | (x & 3)] / 16 ? i + 1 : i;
      const col = ramp[idx];
      const o = (y * BW + x) * 4;
      d[o] = col[0]; d[o + 1] = col[1]; d[o + 2] = col[2]; d[o + 3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
  // sky reflection hugging the waterline
  const bh = Math.min(16, h);
  const wash = ditherBand(BW, bh, (x, y) =>
    BAYER[((y & 3) << 2) | (x & 3)] / 16 < (1 - y / bh) * 0.75 ? rgbA(wc.hi, 255) : null);
  g.globalAlpha = 0.42;
  g.drawImage(wash, 0, 0);
  g.globalAlpha = 1;
  R(g, 0, 0, BW, 1, wc.hi);
  waterCv = c;
  waterCity = state.city;
}

/* ----------------------------------------------------------- light dressing */
// No window frame, no mullions: the pixel art runs edge to edge. All that is baked
// on top is a soft bottom-weighted vignette so the UI bar has something to sit on.
function buildFrame(){
  const c = makeCanvas(BW, BH), g = ctx2(c);
  const img = g.createImageData(BW, BH), d = img.data;
  for(let y = 0; y < BH; y++){
    const ny = y / BH;
    const bottom = Math.pow(clamp((ny - 0.55) / 0.45, 0, 1), 1.9) * 0.30;
    for(let x = 0; x < BW; x++){
      const side = Math.pow(clamp((Math.abs(x / BW - 0.5) - 0.40) / 0.10, 0, 1), 2) *
                   clamp((ny - 0.30) / 0.70, 0, 1) * 0.10;
      const o = (y * BW + x) * 4;
      d[o] = 4; d[o + 1] = 6; d[o + 2] = 8;
      d[o + 3] = Math.round(clamp(bottom + side, 0, 1) * 255);
    }
  }
  g.putImageData(img, 0, 0);
  return c;
}

/* ------------------------------------------------------------------ clouds */
function buildClouds(){
  clouds = [];
  const rnd = mulberry32(777);
  const makers = [
    { w: Math.round(BW * 0.30), h: 20, y: 22, sp: 4.5, a: 0.50 },
    { w: Math.round(BW * 0.20), h: 14, y: 50, sp: 7.0, a: 0.40 },
    { w: Math.round(BW * 0.38), h: 26, y: 12, sp: 3.0, a: 0.36 },
    { w: Math.round(BW * 0.16), h: 11, y: 68, sp: 9.0, a: 0.30 }
  ];
  for(let i = 0; i < makers.length; i++){
    const mk = makers[i];
    const blobs = [];
    const nb = 3 + Math.floor(rnd() * 3);
    for(let k = 0; k < nb; k++){
      blobs.push({ x: mk.w * (0.18 + 0.64 * rnd()), y: mk.h * (0.42 + 0.3 * rnd()),
                   r: mk.h * (0.34 + 0.4 * rnd()) });
    }
    // one sprite for daylight, one for night: a multiply grade cannot lift a cloud
    // above the sky, so the pale version is swapped for a dark one
    const paint = col => {
      const c = makeCanvas(mk.w, mk.h), g = ctx2(c);
      for(let y = 0; y < mk.h; y++){
        let run = -1;
        for(let x = 0; x <= mk.w; x++){
          let inside = false;
          if(x < mk.w && y < mk.h * 0.86){
            for(let k = 0; k < blobs.length; k++){
              const bl = blobs[k];
              const dx = (x - bl.x) / (bl.r * 1.9), dy = (y - bl.y) / bl.r;
              if(dx * dx + dy * dy <= 1){ inside = true; break; }
            }
          }
          if(inside && run < 0) run = x;
          else if(!inside && run >= 0){
            R(g, run, y, x - run, 1, col);
            run = -1;
          }
        }
      }
      return c;
    };
    clouds.push({
      cv:  paint(i === 2 ? "#dfe6e9" : "#e9eef0"),
      cvN: paint(i === 2 ? "#28313f" : "#2f3a4a"),
      x0: rnd() * BW, y: mk.y, w: mk.w, sp: mk.sp, a: mk.a
    });
  }
}

/* ------------------------------------------------------------------- stars */
function buildStars(){
  stars = [];
  const rnd = mulberry32(4242);
  const n = Math.round(BW * BH / 2600);
  for(let i = 0; i < n; i++){
    stars.push({
      x: Math.floor(rnd() * BW),
      y: Math.floor(rnd() * yW * 0.92),
      a: 0.3 + rnd() * 0.7,
      ph: rnd() * 6.283,
      sp: 0.4 + rnd() * 1.6
    });
  }
}

/* --------------------------------------------------------------- particles */
function buildParticles(){
  rain = []; snow = []; drift = [];
  const rnd = mulberry32(99);
  const nRain = clamp(Math.round(BW * BH / 560), 150, 400);
  const nSnow = clamp(Math.round(BW * BH / 1500), 60, 160);
  for(let i = 0; i < nRain; i++){
    rain.push({ x: rnd() * BW, y: rnd() * BH, v: 200 + rnd() * 140,
                len: 2 + Math.round(rnd() * 2), k: 26 + rnd() * 26 });
  }
  for(let i = 0; i < nSnow; i++){
    snow.push({ x: rnd() * BW, y: rnd() * BH, v: 9 + rnd() * 14,
                r: rnd() < 0.35 ? 2 : 1, sw: 14 + rnd() * 16, ph: rnd() * 6.283 });
  }
  // one shared pool; DRIFT decides how many of these are in the air and how
  // they move, so switching city or season costs nothing and never leaks state.
  // Each particle remembers the tree emitter that released it (`ex/ey`) plus a
  // small lateral offset (`ox`), so a respawn always comes out of a crown.
  for(let i = 0; i < 28; i++){
    drift.push({ x: rnd() * BW, y: rnd() * BH, sp: 0.55 + rnd() * 0.9,
                 ph: rnd() * 6.283, c: i % 3,
                 amb: false, ex: 0, ey: 0, ox: 0, j: 0 });
  }
  buildRipples();
}

/* ------------------------------------------------------------------ sprites */
const WHALE = [
  "###.........###",
  "####.......####",
  "#####.....#####",
  ".#####...#####.",
  "..#####.#####..",
  "...#########...",
  "......###......",
  "......###......",
  "......###......",
  ".......#.......",
  ".......#......."
];
const BIRD = [
  [".#...#.", "..#.#..", "...#..."],
  ["...#...", "..#.#..", ".#...#."]
];

function drawWhale(now, p, splashCol){
  const spot = scene.extra && scene.extra.whale;
  if(!spot) return;
  const period = 27, t = (now * 0.001) % period;
  let k = 0;
  if(t < 2.0) k = t / 2.0;
  else if(t < 7.0) k = 1;
  else if(t < 9.4) k = 1 - (t - 7.0) / 2.4;
  const bob = reduceMotion ? 0 : Math.round(Math.sin(now * 0.0004) * 2);
  const baseY = yW + 19 + bob;
  if(k > 0.02){
    const spread = Math.round((1 - k) * 6 + 2);
    bctx.globalAlpha = 0.5 * (1 - Math.abs(k - 0.5) * 1.1);
    for(let i = -spread; i <= spread; i++){
      if(((i + spread) & 1) === 0) R(bctx, spot.x + i * 2, yW + 1, 2, 1, splashCol || p.waterHi);
    }
    bctx.globalAlpha = 1;
  }
  if(k <= 0.02) return;
  const gy = Math.round(baseY - 33 * k);
  const gx = spot.x - 22;
  drawBits(bctx, WHALE, { "#": splashCol || p.waterHi }, gx - 2, gy - 2, 3);
  drawBits(bctx, WHALE, { "#": p.whale }, gx, gy, 3);
}

function drawOutrigger(p){
  const bx = Math.round(BW * 0.80), by = yW + 34;
  R(bctx, bx - 22, by, 30, 3, p.lava);
  R(bctx, bx - 24, by - 2, 4, 3, p.lava);
  R(bctx, bx - 20, by + 3, 26, 1, p.lagoon);
  R(bctx, bx - 4, by - 22, 1, 22, p.palmLo);
  for(let r = 0; r < 16; r++){
    const w = Math.round((r / 16) * 13);
    R(bctx, bx - 3 - w, by - 22 + r, w, 1, r > 13 ? p.cream : p.sandHi);
  }
  R(bctx, bx - 2, by - 22, 2, 22, p.sand);
  R(bctx, bx + 6, by + 4, 14, 2, p.lava);
  R(bctx, bx + 18, by + 2, 2, 4, p.palmLo);
}

function drawJunk(p, now){
  const spot = scene.extra && scene.extra.junk;
  if(!spot) return;
  const bob = reduceMotion ? 0 : Math.round(Math.sin(now * 0.0011) * 1);
  const bx = spot.x - 16, by = spot.y + bob;
  R(bctx, bx, by + 6, 34, 4, p.t1);
  R(bctx, bx + 2, by + 9, 30, 1, p.water);
  R(bctx, bx + 6, by + 2, 22, 5, p.t2);
  R(bctx, bx + 8, by + 4, 3, 2, p.amber);
  R(bctx, bx + 16, by + 4, 3, 2, p.neon);
  for(let r = 0; r < 18; r++){
    const w = Math.round(2 + r * 0.85);
    R(bctx, bx + 22, by - 12 + r, w, 1, r % 3 === 2 ? p.sail : lighten(p.sail, 0.12));
  }
  R(bctx, bx + 21, by - 24, 1, 26, p.hill);
  R(bctx, bx + 12, by - 10, 1, 16, p.hill);
}

/* a harbour ferry, crossing and back, for Sydney */
function drawFerry(p, now){
  const spot = scene.extra && scene.extra.ferry;
  if(!spot) return;
  const bob = reduceMotion ? 0 : Math.round(Math.sin(now * 0.0009 + 1.2));
  const bx = spot.x - 20, by = yW + 29 + bob;
  R(bctx, bx, by, 46, 4, p.ferry);                   // hull
  R(bctx, bx, by, 46, 1, p.ferryGreen);              // green stripe
  R(bctx, bx + 1, by + 4, 44, 1, p.steelLo);
  R(bctx, bx + 10, by - 7, 24, 7, p.ferry);          // cabin
  R(bctx, bx + 10, by - 7, 24, 1, p.sailHi);
  R(bctx, bx + 13, by - 5, 5, 3, p.win);
  R(bctx, bx + 22, by - 5, 6, 3, p.win);
  R(bctx, bx + 8, by - 9, 28, 2, p.steelHi);         // upper deck
  R(bctx, bx - 9, by + 4, 12, 1, p.waterHi);         // wake
}

/* ------------------------------------------------------------- frame pieces */
function layerOff(gName, offs){
  if(gName === "far") return offs.far - PAD;
  if(gName === "mid") return offs.mid - PAD;
  return offs.near - PAD;
}

function drawStarsFx(now, m){
  const a0 = m.night * (1 - state.rainAmt * 0.85) * (1 - state.snowAmt * 0.5);
  if(a0 < 0.03) return;
  const t = now * 0.001;
  const b = bctx;
  for(let i = 0; i < stars.length; i++){
    const st = stars[i];
    const tw = 0.55 + 0.45 * Math.sin(t * st.sp + st.ph);
    b.globalAlpha = a0 * st.a * tw;
    R(b, st.x, st.y, 1, 1, "#e9f1ff");
  }
  b.globalAlpha = 1;
}

function drawCloudsFx(now, m){
  const b = bctx;
  const t = now * 0.001;
  const na = m.night;
  for(let i = 0; i < clouds.length; i++){
    const c = clouds[i];
    const span = BW + c.w + 60;
    let x = (c.x0 + t * c.sp) % span;
    if(x < 0) x += span;
    x -= c.w + 30;
    const base = Math.min(0.9, c.a * (0.85 + 0.5 * state.cloudAmt));
    if(na < 0.97 && base * (1 - na) > 0.01){
      b.globalAlpha = base * (1 - na);
      b.drawImage(c.cv, Math.round(x), c.y);
    }
    if(na > 0.02){
      b.globalAlpha = base * na * 0.9;
      b.drawImage(c.cvN, Math.round(x), c.y);
    }
  }
  b.globalAlpha = 1;
}

let flock = null, nextFlock = 9000;
function drawBirdsFx(now){
  const b = bctx;
  if(reduceMotion) return;
  if(!flock && now > nextFlock){
    flock = {
      x0: BW + 30, y0: 24 + Math.random() * yW * 0.42,
      vx: -(10 + Math.random() * 7), t0: now,
      n: 2 + Math.floor(Math.random() * 2),
      off: [0, 9 + Math.random() * 6, 18 + Math.random() * 10]
    };
  }
  if(!flock) return;
  const x = flock.x0 + (now - flock.t0) * 0.001 * flock.vx;
  if(x < -60){
    flock = null;
    nextFlock = now + 38000 + Math.random() * 50000;
    return;
  }
  const f = Math.round(now * 0.006) & 1;
  for(let i = 0; i < flock.n; i++){
    const bx = Math.round(x - flock.off[i]);
    const by = Math.round(flock.y0 + Math.sin(now * 0.0009 + i) * 4 + i * 5);
    b.globalAlpha = 0.62 - i * 0.12;
    drawBits(b, BIRD[f], { "#": "#232a2e" }, bx, by, 1);
  }
  b.globalAlpha = 1;
}

/* ------------------------------------------------------------- water effects */
let ripples = [];
function buildRipples(){
  ripples = [];
  const rnd = mulberry32(1234);
  const h = Math.max(10, BH - yW);
  for(let i = 0; i < 26; i++){
    ripples.push({
      x: rnd() * BW, y: 4 + rnd() * Math.max(4, h - 8),
      len: 5 + Math.round(rnd() * 16), sp: 3 + rnd() * 8,
      a: 0.10 + rnd() * 0.22, ph: rnd() * 6.283
    });
  }
}

function drawWaterFX(now, m, offs){
  const b = bctx;
  const p = scene.pal;
  const t = now * 0.001;
  const wh = Math.max(10, BH - yW);

  // reflections of the baked buildings, as dashed vertical smears
  const refl = scene.props;
  for(let i = 0; i < refl.length; i++){
    const pr = refl[i];
    const ox = layerOff(pr.g, offs);
    const x0 = pr.x + ox;
    if(pr.w < 4 || x0 + pr.w < -2 || x0 > BW + 2) continue;
    const len = Math.min(26, Math.round(wh * 0.42), Math.max(6, Math.round(pr.h * 0.42)));
    for(let r = 0; r < len; r += 2){
      const yy = yW + 2 + r;
      if(yy >= BH) break;
      const a = (1 - r / len) * 0.26;
      const wob = reduceMotion ? 0 : Math.sin(r * 0.55 + t * 1.6) * 1.6;
      const ww = pr.w * (1 - (r / len) * 0.4);
      b.globalAlpha = a;
      R(b, x0 + wob + (pr.w - ww) / 2, yy, ww, 1, pr.col);
    }
  }
  b.globalAlpha = 1;

  // drifting ripple dashes
  for(let i = 0; i < ripples.length; i++){
    const r = ripples[i];
    const yy = yW + Math.round(r.y);
    if(yy >= BH - 1) continue;
    const span = BW + r.len + 20;
    let x = (r.x + t * r.sp) % span;
    if(x < 0) x += span;
    x -= r.len + 10;
    b.globalAlpha = r.a * (0.7 + 0.3 * Math.sin(t * 1.3 + r.ph));
    R(b, x, yy, r.len, 1, scene.wcol.hi);
  }
  b.globalAlpha = 1;

  // sun / moon glint on the water
  const sp = sunPos();
  const gl = clamp(sp.elev, 0, 1);
  if(gl > 0.04){
    const rows = Math.round(6 + gl * 8);
    for(let r = 0; r < rows; r++){
      const yy = yW + 2 + r;
      if(yy >= BH) break;
      const spread = 6 + r * 5;
      const a = gl * (0.34 - r * 0.022);
      if(a <= 0.02) continue;
      for(let k = 0; k < 5; k++){
        const px0 = sp.x + Math.sin(k * 2.3 + r) * spread;
        const w = 2 + ((k + r) & 3);
        b.globalAlpha = a * (0.5 + 0.5 * Math.sin(t * 1.4 + k * 1.7 + r));
        R(b, px0, yy, w, 1, sp.day ? "#ffe3a8" : "#cfe0f2");
      }
    }
    b.globalAlpha = 1;
  }

  // the city's own bit of life in the water — one table keyed by record id
  const life = WATER_LIFE[scene.id];
  if(life) life(p, now, scene.wcol.hi);
}

/* landmark life on the water: keyed by city id, same table idea as BUILD */
const WATER_LIFE = {
  vancouver: (p, now, wcol) => drawWhale(now, p, wcol),
  hawaii:    p              => drawOutrigger(p),
  hongkong:  (p, now)       => drawJunk(p, now),
  sydney:    (p, now)       => drawFerry(p, now)
};

/* ------------------------------------------------------------------- lights */
function drawLights(now, m, offs){
  const b = bctx;
  const na = m.night;
  if(na < 0.06) return;
  const t = now * 0.001;
  for(let i = 0; i < scene.windows.length; i++){
    const w = scene.windows[i];
    const a = (0.5 + 0.5 * Math.sin(w.ph + t * (6.283 / w.per))) * na * (w.dim || 1);
    if(a < 0.05) continue;
    b.globalAlpha = Math.min(1, a);
    R(b, w.x + layerOff(w.g, offs), w.y, w.w, w.h, w.col);
  }
  b.globalAlpha = 1;

  for(let i = 0; i < scene.lights.length; i++){
    const L = scene.lights[i];
    if(L.kind === "neon"){
      const flick = 0.62 + 0.38 * Math.sin(t * 2.1 + L.ph) * Math.sin(t * 0.37 + L.ph);
      b.globalAlpha = clamp(na * flick, 0, 1);
      R(b, L.x + offs.mid - PAD, L.y, L.w, L.h, L.col);
      b.globalAlpha = 1;
    } else if(L.kind === "lantern"){
      const sway = reduceMotion ? 0 : Math.round(Math.sin(t * 0.7 + L.ph) * 2);
      const lx = L.x + sway, ly = L.y;
      R(b, lx + 2, 0, 1, ly, "#2b2320");
      b.globalAlpha = clamp(0.2 + na * 0.85, 0, 1);
      for(let yy = -3; yy <= 8; yy++){
        for(let xx = -3; xx <= 6; xx++){
          if((xx === 0 || xx === 5 || yy === -3 || yy === 6) && ((xx + yy) & 1) === 0)
            R(b, lx + xx + 1, ly + yy, 1, 1, L.col);
        }
      }
      b.globalAlpha = 1;
      R(b, lx + 1, ly, 5, 7, L.col);
      R(b, lx + 2, ly + 2, 3, 3, "#ffd08a");
      R(b, lx + 1, ly + 7, 5, 1, "#d8a552");
      R(b, lx + 1, ly - 1, 5, 1, "#2b2320");
    }
  }
}

/* --------------------------------------------------------- seasonal drift
   One renderer for every falling thing: petals, leaves, seeds, needles, motes.
   The DRIFT table supplies the sprite, the speed and the count; the pool is
   shared, so a city/season change just swaps what those particles look like.
   Every particle is released from a crown emitter of the baked tree (or, for
   the few ambient specs, from the top of the frame); heavy rain or snow winds
   the layer down to nothing — it must never fight the weather it sits on. */
function currentDrift(){
  return driftFor(scene ? scene.id : state.city, state.season);
}
function driftAmount(){
  if(!currentDrift()) return 0;
  return clamp(1 - state.rainAmt * 2.4 - state.snowAmt * 5, 0, 1);
}

/* Put the shared pool under the tree this bake painted.  Each particle takes a
   slice of one emitter's line of fall; the seeded phase decides where along it
   it starts, so a fresh city/season opens with a believable column rather than
   a burst at the crown.  `ambient` is the optional top-of-frame trickle. */
function seedDrift(emitters){
  const spec = currentDrift();
  const ems = (emitters && emitters.length) ? emitters : [];
  const n = spec ? Math.min(spec.n, drift.length) : 0;
  const nAmb = spec ? Math.round(clamp(spec.ambient || 0, 0, 1) * n) : 0;
  for(let i = 0; i < drift.length; i++){
    const l = drift[i];
    l.j = 0;
    if(!spec){ l.amb = true; continue; }      // a season with no drift: pool idle
    const ambient = nAmb > 0 && i >= n - nAmb;
    l.amb = ambient || !ems.length;
    if(l.amb){
      l.ex = Math.round((l.ph / 6.283) * BW);
      l.ey = -4; l.ox = 0;
      l.x = l.ex;
      l.y = Math.round((l.ph / 6.283) * BH);
    } else {
      const e = ems[i % ems.length];
      l.ex = e.x; l.ey = e.y;
      l.ox = Math.round(((l.ph / 6.283) * 2 - 1) * (e.spread || 3));
      l.y = l.ey + Math.round((l.ph / 6.283) * Math.max(2, BH - l.ey) * 0.9);
      // place it where the live motion would already have carried it: the same
      // wind+wobble equation integrated over the fall time, so a fresh bake
      // opens as a wind-blown fan under the crown instead of a vertical thread
      const speed = Math.max(1, spec.rate * (0.7 + l.sp * 0.55));
      const tt = (l.y - l.ey) / speed;
      const f = 0.55 + l.sp * 0.5;
      const sway = (spec.wobble / 0.5) * (Math.cos(l.ph) - Math.cos(0.5 * tt + l.ph));
      l.x = clamp(l.ex + l.ox + Math.round(f * (2 * tt + sway)), -4, BW + 4);
    }
  }
}

function drawDrift(now, m){
  const spec = currentDrift();
  const a0 = driftAmount();
  if(!spec || a0 < 0.02) return;
  const b = bctx;
  const cols = spec.cols;
  const night = 0.55 + 0.45 * (1 - m.night);
  const shape = spec.shape || "leaf";
  for(let i = 0; i < spec.n && i < drift.length; i++){
    const l = drift[i];
    const x = Math.round(l.x), y = Math.round(l.y);
    if(y < -4 || y > BH + 4 || x < -6 || x > BW + 6) continue;
    const c0 = cols[l.c % cols.length], c1 = cols[(l.c + 1) % cols.length];
    b.globalAlpha = a0 * night;
    if(shape === "leaf"){
      R(b, x, y, 2, 2, c0);
      R(b, x, y + 1, 1, 1, c0);
      R(b, x + 1, y + 2, 1, 1, c1);
    } else if(shape === "petal"){
      R(b, x, y, 2, 1, c0);
      R(b, x + 1, y + 1, 1, 1, c1);
    } else if(shape === "seed"){
      R(b, x, y, 1, 2, c0);
      R(b, x + 1, y + 1, 1, 1, c1);
    } else {                                    // "mote": a fleck of haze
      b.globalAlpha = a0 * night * 0.55;
      R(b, x, y, 1, 1, c0);
      if((i & 3) === 0) R(b, x + 1, y + 1, 1, 1, c1);
    }
  }
  b.globalAlpha = 1;
}

/* ------------------------------------------------------------------ weather */
function drawWeather(now, m){
  const b = bctx;
  if(state.rainAmt > 0.01){
    const bright = (m.top[0] + m.top[1] + m.top[2]) / 3;
    const col = bright > 140 ? "#7f95a9" : "#c3d3e7";
    b.globalAlpha = 0.72 * state.rainAmt;
    for(let i = 0; i < rain.length; i++){
      const r = rain[i];
      R(b, r.x, r.y, 1, r.len, col);
    }
    b.globalAlpha = 1;
  }
  if(state.snowAmt > 0.01){
    b.globalAlpha = 0.85 * state.snowAmt;
    for(let i = 0; i < snow.length; i++){
      const f = snow[i];
      R(b, f.x, f.y, f.r, f.r, "#ffffff");
    }
    b.globalAlpha = 1;
  }
  drawDrift(now, m);
}

/* --------------------------------------------------------------------- grade */
/* A few cities carry a per-season colour cast on top of the hour tint: Sydney
   in winter is the mild grey harbour light, in summer barely touched. */
const SEASON_CAST = {
  sydney: {
    winter: { tint: [152, 164, 176], a: 0.42 },   // the mild grey harbour light
    summer: { tint: [255, 249, 232], a: 0.05 }
  }
};
function seasonCast(){
  const byCity = SEASON_CAST[state.city];
  return (byCity && byCity[state.season]) || null;
}
function grade(m){
  const b = bctx;
  b.globalCompositeOperation = "multiply";
  if(m.ta > 0.002){
    b.fillStyle = "rgba(" + (m.tint[0] | 0) + "," + (m.tint[1] | 0) + "," + (m.tint[2] | 0) + "," + m.ta.toFixed(3) + ")";
    b.fillRect(0, 0, BW, BH);
  }
  const cast = seasonCast();
  if(cast && cast.a > 0.002){
    b.fillStyle = "rgba(" + (cast.tint[0] | 0) + "," + (cast.tint[1] | 0) + "," + (cast.tint[2] | 0) + "," + cast.a.toFixed(3) + ")";
    b.fillRect(0, 0, BW, BH);
  }
  if(state.cloudAmt > 0.01){
    b.fillStyle = "rgba(150,159,172," + (0.26 * state.cloudAmt).toFixed(3) + ")";
    b.fillRect(0, 0, BW, BH);
  }
  if(state.rainAmt > 0.01){
    b.fillStyle = "rgba(96,116,138," + (0.30 * state.rainAmt).toFixed(3) + ")";
    b.fillRect(0, 0, BW, BH);
  }
  b.globalCompositeOperation = "lighter";
  if(state.snowAmt > 0.01){
    b.fillStyle = "rgba(196,214,230," + (0.045 * state.snowAmt).toFixed(3) + ")";
    b.fillRect(0, 0, BW, BH);
  }
  b.globalCompositeOperation = "source-over";
}

/* ------------------------------------------------------------------- parallax */
function offsets(now){
  if(reduceMotion) return { far: 0, mid: 0, near: 0 };
  const t = now * 0.001;
  return {
    far:  Math.round(Math.sin(t * 0.020) * 6),
    mid:  Math.round(Math.sin(t * 0.014 + 1.7) * 4),
    near: Math.round(Math.sin(t * 0.009 + 3.1) * 2)
  };
}

/* -------------------------------------------------------------------- frame */
function drawFrame(now, dt){
  // keep the ambience in step with the weather (rain amount, snow dulling the
  // top end) and the season; a no-op until sound has been started once
  if(ac) updateAudio();
  // the season can roll over from the info-card interval; the guard means the
  // layers are rebuilt exactly once and every other frame is a pure blit
  if(!scene || scene.id !== state.city || scene.season !== state.season ||
     scene.BW !== BW || scene.BH !== BH) buildScene(state.city);
  const m = moodAt(state.hour);
  const b = bctx;
  b.globalCompositeOperation = "source-over";
  b.globalAlpha = 1;

  const bucket = Math.round(state.hour * 20) / 20;
  if(bucket !== skyBucket){ paintSky(m); skyBucket = bucket; }
  if(!waterCv || waterCity !== state.city) paintWater();

  b.drawImage(skyCv, 0, 0);
  drawStarsFx(now, m);
  drawCloudsFx(now, m);
  drawBirdsFx(now);

  const offs = offsets(now);
  b.drawImage(scene.farC, -PAD + offs.far, 0);
  b.drawImage(scene.midC, -PAD + offs.mid, 0);
  b.drawImage(waterCv, 0, yW);
  drawWaterFX(now, m, offs);
  b.drawImage(scene.nearC, -PAD + offs.near, 0);

  grade(m);
  drawLights(now, m, offs);
  // settled snow on a bare crown: baked once with the winter tree, faded in by
  // the live snow amount, so weather never triggers a re-bake
  if(scene.treeSnow && state.snowAmt > 0.01){
    const sn = scene.treeSnow;
    b.globalAlpha = clamp(state.snowAmt * 0.8, 0, 1);
    b.drawImage(sn.cv, sn.x + (sn.layer === "mid" ? offs.mid : offs.near), sn.y);
    b.globalAlpha = 1;
  }
  drawWeather(now, m);
  b.drawImage(frameCv, 0, 0);

  if(dctx){
    dctx.imageSmoothingEnabled = false;
    if(bx > 0 || by > 0){                          // only if a rounding gap ever appears
      dctx.fillStyle = "#070a0c";
      dctx.fillRect(0, 0, cv.width, cv.height);
    }
    dctx.drawImage(buf, 0, 0, BW, BH, bx, by, BW * px, BH * px);
  }
}

/* =========================================================================
   Sound: a port of relax.html's ambient engine.  A washed five-voice pad, a
   sub bass, sparse "music box" plucks through a convolution reverb generated
   in the page, an air bed and a rain bed, all under a compressor and a soft
   high shelf on the master.  The four chords, hold time, pad cutoff, pluck
   scale, reverb length/decay and air level are a per-city profile (MUSIC);
   a city change glides the running graph to the new profile instead of
   restarting it.  Nothing here runs until a real user gesture.
   ========================================================================= */
let ac = null, master = null, mixBus = null, revSend = null, conv = null, revGain = null;
let rainGain = null, airGain = null, padGain = null, padFilter = null, toneFilter = null;
let bassOsc = null, padVoices = [], analyser = null, rmsBuf = null;
let soundOn = false, vol = 0.18, soundWanted = false;
let chordIx = -1, nextChordAt = 0, nextPluckAt = 0, schedTimer = 0;
let gestureArmed = false, gestureHandler = null, resumeClickGuard = false, resumeClickAt = 0;
let sndBtn = null, volInput = null;

/* One profile per city.  `chords` are four consonant voicings (five pad
   frequencies each, 130-590 Hz; bass 40-100 Hz), `hold` is how long one chord
   rides (11-16 s), `cutoff` is the pad lowpass, `scale` the pluck pool,
   `reverb` the generated impulse length/decay (+ wet level), `air` the noise

const MUSIC_FALLBACK = "vancouver";
function musicFor(id){ return MUSIC[id] || MUSIC[MUSIC_FALLBACK]; }
function musicProfile(){ return musicFor(state.city); }
/* a season tint on the pad lowpass: brighter in spring, darker in winter */
const SEASON_CUT = { spring: 1.06, summer: 1.00, autumn: 0.94, winter: 0.88 };
function seasonCut(){ return SEASON_CUT[state.season] || 1; }
function musicChord(){
  const prof = musicProfile();
  const n = prof.chords.length;
  const ix = ((chordIx % n) + n) % n;
  return prof.chords[ix];
}

/* the city's air bed + the weather on top of it (snow lifts it, rain a little) */
function airLevel(){
  const prof = musicProfile();
  return prof.air + state.snowAmt * 0.020 + state.rainAmt * 0.012;
}

/* a short RMS measurement tapped off master with an AnalyserNode */
function audioRms(){
  if(!analyser || !rmsBuf) return 0;
  try{
    analyser.getFloatTimeDomainData(rmsBuf);
    let s = 0;
    for(let i = 0; i < rmsBuf.length; i++){ const v = rmsBuf[i]; s += v * v; }
    return Math.sqrt(s / Math.max(1, rmsBuf.length));
  }catch(e){ return 0; }
}

function makeImpulse(seconds, decay){
  const len = Math.max(1, Math.floor(ac.sampleRate * seconds));
  const buf = ac.createBuffer(2, len, ac.sampleRate);
  for(let ch = 0; ch < 2; ch++){
    const d = buf.getChannelData(ch);
    let lp = 0;
    for(let i = 0; i < len; i++){
      const t = i / len;
      const n = (Math.random() * 2 - 1) * Math.pow(1 - t, decay);
      lp = lp * 0.72 + n * 0.28;            // darkened tail
      d[i] = lp;
    }
  }
  return buf;
}

function makeNoise(seconds){
  const len = Math.max(1, Math.floor(ac.sampleRate * seconds));
  const buf = ac.createBuffer(1, len, ac.sampleRate);
  const d = buf.getChannelData(0);
  let b0 = 0, b1 = 0, b2 = 0;
  for(let i = 0; i < len; i++){
    const w = Math.random() * 2 - 1;
    b0 = 0.99765 * b0 + w * 0.0990460;
    b1 = 0.96300 * b1 + w * 0.2965164;
    b2 = 0.57000 * b2 + w * 1.0526913;
    d[i] = (b0 + b1 + b2 + w * 0.1848) * 0.19;
  }
  return buf;
}

function audioInit(){
  if(ac) return true;
  const AC = (typeof window !== "undefined" && (window.AudioContext || window.webkitAudioContext)) || null;
  if(!AC) return false;
  try { ac = new AC(); } catch(e){ ac = null; return false; }
  const prof = musicProfile();

  master = ac.createGain();
  master.gain.value = 0;

  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -20; comp.knee.value = 18; comp.ratio.value = 3;
  comp.attack.value = 0.02; comp.release.value = 0.4;
  comp.connect(master);

  const shelf = ac.createBiquadFilter();
  shelf.type = "highshelf"; shelf.frequency.value = 5200; shelf.gain.value = -2.5;
  shelf.connect(comp);

  // snow takes a little top end off the whole mix, cheaply
  toneFilter = ac.createBiquadFilter();
  toneFilter.type = "lowpass"; toneFilter.frequency.value = 18000; toneFilter.Q.value = 0.4;
  toneFilter.connect(shelf);

  mixBus = ac.createGain();
  mixBus.gain.value = 1;
  mixBus.connect(toneFilter);

  // reverb: a generated stereo impulse, retuned per city
  conv = ac.createConvolver();
  conv.buffer = makeImpulse(prof.reverb.seconds, prof.reverb.decay);
  revGain = ac.createGain();
  revGain.gain.value = prof.reverb.wet;
  conv.connect(revGain); revGain.connect(mixBus);
  revSend = ac.createGain();
  revSend.gain.value = 1;
  revSend.connect(conv);

  // pad: five voices, triangle plus a slightly detuned sine
  padFilter = ac.createBiquadFilter();
  padFilter.type = "lowpass"; padFilter.frequency.value = prof.cutoff; padFilter.Q.value = 0.3;
  padGain = ac.createGain();
  padGain.gain.value = 0.17;
  padFilter.connect(padGain);
  padGain.connect(mixBus);
  const padSend = ac.createGain(); padSend.gain.value = 0.5;
  padGain.connect(padSend); padSend.connect(revSend);

  padVoices = [];
  for(let i = 0; i < 5; i++){
    const a = ac.createOscillator(); a.type = "triangle";
    const b = ac.createOscillator(); b.type = "sine";
    a.frequency.value = b.frequency.value = prof.chords[0].pad[i];
    const g = ac.createGain();
    g.gain.value = 0.05;
    a.connect(g); b.connect(g); g.connect(padFilter);
    a.start(); b.start();
    padVoices.push({ a, b, g });
  }

  // sub bass
  bassOsc = ac.createOscillator();
  bassOsc.type = "sine";
  bassOsc.frequency.value = prof.chords[0].bass;
  const bassGain = ac.createGain();
  bassGain.gain.value = 0.055;
  bassOsc.connect(bassGain); bassGain.connect(mixBus); bassGain.connect(revSend);
  bassOsc.start();

  // air
  const airSrc = ac.createBufferSource(); airSrc.buffer = makeNoise(4); airSrc.loop = true;
  const airF = ac.createBiquadFilter();
  airF.type = "bandpass"; airF.frequency.value = 620; airF.Q.value = 0.6;
  airGain = ac.createGain();
  airGain.gain.value = prof.air;
  airSrc.connect(airF); airF.connect(airGain); airGain.connect(mixBus);
  airSrc.start();
  const airLfo = ac.createOscillator(); airLfo.frequency.value = 0.05;
  const airLfoG = ac.createGain(); airLfoG.gain.value = 220;
  airLfo.connect(airLfoG); airLfoG.connect(airF.frequency); airLfo.start();

  // rain bed
  const rs = ac.createBufferSource(); rs.buffer = makeNoise(4); rs.loop = true;
  const rh = ac.createBiquadFilter(); rh.type = "highpass"; rh.frequency.value = 1200;
  const rl = ac.createBiquadFilter(); rl.type = "lowpass"; rl.frequency.value = 5200;
  rainGain = ac.createGain();
  rainGain.gain.value = 0;
  rs.connect(rh); rh.connect(rl); rl.connect(rainGain); rainGain.connect(mixBus);
  const rainSend = ac.createGain(); rainSend.gain.value = 0.25;
  rainGain.connect(rainSend); rainSend.connect(revSend);
  rs.start();

  // RMS tap off the master mix (after the volume fade, so it reads what is
  // heard).  The analyser is inline in the output path: WebAudio only pulls a
  // branch that reaches the destination, so master -> analyser -> destination.
  analyser = ac.createAnalyser();
  analyser.fftSize = 512;
  analyser.smoothingTimeConstant = 0.2;
  rmsBuf = new Float32Array(analyser.fftSize);
  master.connect(analyser);
  analyser.connect(ac.destination);

  return true;
}

function pluck(freq, when, prof){
  if(!ac) return;
  prof = prof || musicProfile();
  const amp = prof.pluckLevel || 0.10;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, when);
  g.gain.exponentialRampToValueAtTime(amp, when + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, when + 3.6);

  const o = ac.createOscillator(); o.type = "sine"; o.frequency.value = freq;
  const o2 = ac.createOscillator(); o2.type = "sine"; o2.frequency.value = freq * 2.005;
  const g2 = ac.createGain();
  g2.gain.setValueAtTime(0.0001, when);
  g2.gain.exponentialRampToValueAtTime(amp * 0.2, when + 0.012);
  g2.gain.exponentialRampToValueAtTime(0.0001, when + 1.2);

  o.connect(g); o2.connect(g2);
  g.connect(mixBus); g2.connect(mixBus);
  g.connect(revSend); g2.connect(revSend);
  o.start(when); o2.start(when);
  o.stop(when + 3.8); o2.stop(when + 1.4);
}

/* glide the five pad voices and the sub to the current profile's current
   chord; also ease the pad cutoff.  Used both by the scheduler and by a city
   change, so a switch is a glide rather than a restart. */
function applyChord(when){
  if(!ac) return;
  const prof = musicProfile();
  const ch = musicChord();
  for(let i = 0; i < padVoices.length; i++){
    const v = padVoices[i];
    const f = ch.pad[i];
    if(!Number.isFinite(f)) continue;
    v.a.frequency.setTargetAtTime(f, when, 2.5);
    v.b.frequency.setTargetAtTime(f * 1.0035, when, 2.5);
  }
  if(bassOsc) bassOsc.frequency.setTargetAtTime(ch.bass, when, 2.4);
  if(padFilter) padFilter.frequency.setTargetAtTime(prof.cutoff * seasonCut(), when, 1.3);
}

/* A city change while sound is on: glide to the new pads/bass, swap the
   reverb tail to the new profile, ease the cutoff/air and the master trim.
   No oscillator is rebuilt and nothing restarts. */
function applyProfile(when){
  if(!ac) return;
  const t = when === undefined ? ac.currentTime : when;
  const prof = musicProfile();
  applyChord(t);
  if(airGain) airGain.gain.setTargetAtTime(airLevel(), t, 1.6);
  if(revGain) revGain.gain.setTargetAtTime(prof.reverb.wet, t, 1.0);
  if(conv){
    try { conv.buffer = makeImpulse(prof.reverb.seconds, prof.reverb.decay); } catch(e){}
  }
  if(master) master.gain.setTargetAtTime(vol * 0.5 * (prof.level || 1), t, 1.1);
}

function scheduler(){
  if(!ac || !soundOn) return;
  const prof = musicProfile();
  const now = ac.currentTime;
  const horizon = now + 2.0;
  if(nextChordAt < horizon){
    const when = Math.max(now, nextChordAt);
    chordIx = (chordIx + 1) % prof.chords.length;
    applyChord(when);
    nextChordAt = when + prof.hold + Math.random() * 1.5;
  }
  if(nextPluckAt < horizon){
    const when = Math.max(now, nextPluckAt);
    const scale = prof.scale;
    pluck(scale[Math.floor(Math.random() * scale.length)], when, prof);
    const gap = prof.pluckEvery || [3.0, 8.0];
    nextPluckAt = when + gap[0] + Math.random() * (gap[1] - gap[0]);
  }
}

function startSound(){
  if(!audioInit()) return false;
  try { ac.resume(); } catch(e){}
  soundOn = true;
  soundWanted = true;
  const prof = musicProfile();
  chordIx = Math.floor(Math.random() * prof.chords.length);
  const t = ac.currentTime;
  applyProfile(t);
  nextChordAt = t + prof.hold;
  nextPluckAt = t + 3 + Math.random() * 4;
  clearInterval(schedTimer);
  schedTimer = setInterval(scheduler, 250);
  return true;
}

function stopSound(){
  soundOn = false;
  soundWanted = false;
  if(!ac) return;
  clearInterval(schedTimer);
  if(master) master.gain.setTargetAtTime(0, ac.currentTime, 0.6);
}

function setSoundOn(on){
  disarmGestureStart();
  if(on){
    if(!startSound()){ soundWanted = false; paintSoundButton(); return false; }
    soundWanted = true;
  } else {
    stopSound();
    soundWanted = false;
  }
  paintSoundButton();
  savePrefs();
  return soundOn;
}

function disarmGestureStart(){
  gestureArmed = false;
  if(gestureHandler && typeof removeEventListener === "function"){
    try { removeEventListener("pointerdown", gestureHandler, true); } catch(e){}
  }
  gestureHandler = null;
}

/* Browsers only allow the audio context to start from a gesture.  If the
   stored preference is "on", arm a one-shot pointerdown listener instead of
   autoplaying; the first click/tap anywhere starts the sound. */
function armGestureStart(){
  if(gestureArmed || soundOn) return false;
  if(typeof addEventListener !== "function") return false;
  gestureArmed = true;
  const onFirst = e => {
    disarmGestureStart();
    resumeClickGuard = !!(sndBtn && e && (e.target === sndBtn ||
      (typeof sndBtn.contains === "function" && sndBtn.contains(e.target))));
    resumeClickAt = (typeof performance !== "undefined" && performance.now) ? performance.now() : Date.now();
    if(startSound()){
      soundWanted = true;
      paintSoundButton();
      savePrefs();
    } else {
      soundWanted = false;
      resumeClickGuard = false;
      paintSoundButton();
    }
  };
  gestureHandler = onFirst;
  addEventListener("pointerdown", onFirst, true);
  return true;
}

function paintSoundButton(){
  if(!sndBtn) return;
  sndBtn.setAttribute("aria-pressed", String(soundOn || (gestureArmed && soundWanted)));
  sndBtn.textContent = soundOn ? "sound on" : "sound";
  sndBtn.title = soundOn ? "Turn ambient sound off"
    : (gestureArmed && soundWanted) ? "Sound is on · click anywhere to start it"
    : "Turn ambient sound on";
}

/* once per frame (from drawFrame, so every render path keeps it in sync):
   rain follows state.rainAmt, snow lifts the air bed and dulls the top end,
   and the season can tint the pad cutoff a little. */
function updateAudio(){
  if(!ac || !soundOn) return;
  const t = ac.currentTime;
  const prof = musicProfile();
  if(rainGain) rainGain.gain.setTargetAtTime(state.rainAmt * 0.085, t, 0.8);
  if(airGain) airGain.gain.setTargetAtTime(airLevel(), t, 1.0);
  if(toneFilter)
    toneFilter.frequency.setTargetAtTime(lerp(18000, 9000, clamp(state.snowAmt, 0, 1)), t, 1.2);
  if(padFilter){
    // the session's half colours the room slightly: focus dimmer, break brighter
    const phase = session.kind === "focus" ? 0.90 : session.kind === "break" ? 1.14 : 1;
    const want = prof.cutoff * seasonCut() * phase;
    if(Math.abs(padFilter.frequency.value - want) > want * 0.03)
      padFilter.frequency.setTargetAtTime(want, t, 1.2);
  }
}

/* =========================================================================
   UI: bottom bar, corner card, city clocks, live weather.
   ========================================================================= */

let uiEl, hourInput, clockEl, cycleBtn, ownBtn, cityBtns = [], wxBtns = [], snowBtn = null;
let infoEl, infoHead, infoPlace, infoClock, infoRefresh, infoCond, infoTemp, infoMeta, infoSceneEl, infoSeasonEl;
let gardenLink = null, dprNow = 1;

let fetchState = "idle", lastFetchAt = 0, placeCode = null, placeTemp = null;

const pad2 = n => String(n).padStart(2, "0");
function fmtHour(h){
  const x = ((h % 24) + 24) % 24;
  const hh = Math.floor(x);
  const mm = Math.min(59, Math.round((x - hh) * 60));
  return pad2(hh) + ":" + pad2(mm);
}
function ownHour(){
  const d = new Date();
  return d.getHours() + d.getMinutes() / 60;
}
function cityNow(){ return localHour(cityRecord(state.city).tz); }

/* ?city=<id> on boot preselects that city (file:// included: no URL API needed) */
function urlCity(){
  try{
    if(typeof location === "undefined" || !location.search) return null;
    const m = /[?&]city=([^&#]+)/.exec(location.search);
    if(!m) return null;
    const id = decodeURIComponent(m[1]).toLowerCase();
    return CITY_BY_ID[id] ? id : null;
  }catch(e){ return null; }
}

function wxToCode(kind){ return kind === "rain" ? 61 : kind === "snow" ? 71 : 0; }
function condLabel(code){
  if(code === 0) return "Clear sky";
  if(code <= 2) return "Partly cloudy";
  if(code === 3) return "Overcast";
  if(code === 45 || code === 48) return "Fog";
  if(code >= 51 && code <= 57) return "Drizzle";
  if(code >= 61 && code <= 67) return "Rain";
  if(code >= 71 && code <= 77) return "Snow";
  if(code >= 80 && code <= 82) return "Showers";
  if(code === 85 || code === 86) return "Snow showers";
  if(code >= 95) return "Thunderstorm";
  return "—";
}
function weatherKind(code){
  if([71, 73, 75, 77, 85, 86].indexOf(code) >= 0) return "snow";
  if((code >= 51 && code <= 67) || (code >= 80 && code <= 82) || code >= 95) return "rain";
  return "clear";
}

/* live conditions from Open-Meteo (no key, browser-callable).  Offline the clock
   still works and the card says so. */
async function refreshWeather(){
  if(state.own || typeof fetch !== "function"){ updateInfo(); return; }
  const c = cityRecord(state.city);
  fetchState = "loading";
  updateInfo();
  try{
    const url = "https://api.open-meteo.com/v1/forecast?latitude=" + c.lat + "&longitude=" + c.lon +
                "&current=weather_code,temperature_2m,cloud_cover&timezone=auto";
    const r = await fetch(url, { cache: "no-store" });
    if(!r.ok) throw new Error("http " + r.status);
    const j = await r.json();
    const cur = (j && j.current) || {};
    state.wxAuto = true;
    placeCode = Number.isFinite(cur.weather_code) ? Number(cur.weather_code) : null;
    setWeather(weatherKind(placeCode));
    state.cloudAmt = Number.isFinite(cur.cloud_cover) ? clamp(cur.cloud_cover / 100, 0, 1) : 0;
    placeTemp = Number.isFinite(cur.temperature_2m) ? Math.round(cur.temperature_2m) : null;
    fetchState = "ok";
    lastFetchAt = Date.now();
  }catch(e){
    fetchState = "error";
  }
  updateInfo();
}

function updateInfo(){
  if(!infoPlace) return;
  const c = cityRecord(state.city);
  const realH = state.own ? ownHour() : localHour(c.tz);
  refreshSeason();
  syncSnowButton();

  infoPlace.textContent = state.own ? "Own time" : c.name;
  infoClock.textContent = fmtHour(realH);
  if(infoSeasonEl){
    const s = state.season;
    infoSeasonEl.textContent = s.charAt(0).toUpperCase() + s.slice(1) + " · " +
      (hemisphereOf(c.lat) === "south" ? "southern" : "northern") + " hemisphere";
  }
  if(!state.own){
    infoCond.textContent = !state.wxAuto ? condLabel(wxToCode(state.wx))
      : fetchState === "loading" ? "Loading…"
      : placeCode === null ? "—" : condLabel(placeCode);
    infoTemp.textContent = placeTemp === null ? "" : Math.round(placeTemp) + "°C";
  } else {
    infoCond.textContent = condLabel(wxToCode(state.wx));
    infoTemp.textContent = "";
  }

  const age = lastFetchAt ? Math.round((Date.now() - lastFetchAt) / 60000) : null;
  infoMeta.textContent = (state.own || !state.wxAuto) ? "Weather set by hand"
    : fetchState === "error" ? "Offline · last known"
    : fetchState !== "ok" ? "Fetching…"
    : "Open-Meteo" + (age === null ? "" : " · " + (age < 1 ? "just now" : age + "m ago"));

  const differs = Math.abs(state.hour - realH) > 0.12;
  infoSceneEl.hidden = !differs;
  if(differs) infoSceneEl.textContent = "Scene " + fmtHour(state.hour) + (state.cycleOn ? " · cycling" : "");

  const busy = fetchState === "loading" && !state.own;
  infoRefresh.disabled = state.own;
  infoRefresh.classList.toggle("spin", busy);
  infoRefresh.title = state.own ? "Pick a city to see its live weather" : "Refresh this city now";
  infoHead.setAttribute("aria-expanded", String(!infoEl.classList.contains("closed")));
  tickSession();
}

/* ------------------------------------------------------------- weather tick */
function updateWeather(dt){
  state.rainAmt += (state.rainTarget - state.rainAmt) * Math.min(1, dt * 1.4);
  state.snowAmt += (state.snowTarget - state.snowAmt) * Math.min(1, dt * 1.4);
  if(state.rainAmt < 0.002 && state.rainTarget === 0) state.rainAmt = 0;
  if(state.snowAmt < 0.002 && state.snowTarget === 0) state.snowAmt = 0;

  const t = performance.now() * 0.001;
  for(let i = 0; i < rain.length; i++){
    const r = rain[i];
    r.y += r.v * dt;
    r.x -= r.k * dt;
    if(r.y > BH){ r.y = -4; r.x = Math.random() * BW; }
    if(r.x < -2) r.x = BW + 2;
  }
  for(let i = 0; i < snow.length; i++){
    const f = snow[i];
    f.y += f.v * dt;
    f.x += Math.sin(t * 0.7 + f.ph) * f.sw * dt;
    if(f.y > BH){ f.y = -3; f.x = Math.random() * BW; }
    if(f.x < -2) f.x = BW + 2; else if(f.x > BW + 2) f.x = -2;
  }
  const spec = currentDrift();
  if(spec){
    for(let i = 0; i < drift.length; i++){
      const l = drift[i];
      const speed = spec.rate * (0.7 + l.sp * 0.55);
      l.y += speed * dt;
      l.x += (Math.sin(t * 0.5 + l.ph) * spec.wobble + 2) * (0.55 + l.sp * 0.5) * dt;
      if(l.amb){
        // the ambient trickle enters across the top and never claims a crown
        if(l.y > BH){ l.y = -4; l.x = Math.round((l.ph / 6.283) * BW); }
        if(l.x > BW + 4) l.x = -4;
      } else if(l.y > BH || l.x > BW + 6){
        // released again from the same crown emitter: the drift keeps a source
        l.j = (l.j + 1) & 3;
        l.y = l.ey - 2;
        l.x = l.ex + l.ox + ((l.j & 1) ? 2 : -2);
        l.ph += 0.9;
      }
    }
  }
}

/* --------------------------------------------------------------- main loop */
let lastFrame = 0, hourSyncAt = 0;
function tick(now){
  const dt = Math.min(0.05, Math.max(0.001, (now - lastFrame) / 1000));
  lastFrame = now;
  // the scene is always the city's real local time: resync once a second
  if(now - hourSyncAt > 1000){
    hourSyncAt = now;
    const real = cityNow();
    if(real !== state.hour){ state.hour = real; updateClockLabel(); }
  }
  updateWeather(dt);
  drawFrame(now, dt);
  requestAnimationFrame(tick);
}

/* ------------------------------------------------------------------- boot */
function measure(){
  const cssW = Math.max(240, innerWidth), cssH = Math.max(160, innerHeight);
  const dpr = Math.min(isFirefox ? 1.25 : 2, window.devicePixelRatio || 1);
  cv.width = Math.round(cssW * dpr);
  cv.height = Math.round(cssH * dpr);
  cv.style.width = cssW + "px";
  cv.style.height = cssH + "px";
  // an art pixel is an integer number of device pixels, sized so the buffer is ~480 wide
  const AR = 1.62;                                  // a window has a landscape shape
  const fit = () => {
    let w = Math.ceil(cv.width / p), h = Math.ceil(cv.height / p);
    if(h / w > 1 / AR) h = Math.max(120, Math.round(w / AR));
    return [w, h];
  };
  let p = Math.max(1, Math.round(Math.min(cssW / 480, cssH / 270) * dpr));
  let size = fit();
  while(size[0] * size[1] > 300000 && p < 32){ p++; size = fit(); }
  // fill the viewport: pick the integer art-pixel scale that covers it, then centre-crop.
  // (No letterbox, no window frame — the art runs edge to edge.)
  const pc = Math.max(1, Math.ceil(cv.width / size[0]), Math.ceil(cv.height / size[1]));
  allocate(size[0], size[1], pc);
  bx = Math.round((cv.width - size[0] * pc) / 2);
  by = Math.round((cv.height - size[1] * pc) / 2);
  // portrait windows crop the sides hard; keep the pagoda island (at ~0.215 of the
  // art width, bottom-left) on screen by shifting the crop toward it
  if(cv.height > cv.width * 0.95){
    const want = Math.round(cv.width * 0.30 - size[0] * pc * 0.215);
    const lowB = cv.width - size[0] * pc;          // most-negative allowed
    bx = Math.max(lowB, Math.min(0, want));
  }
  dprNow = dpr;
  layoutGardenLink();
}

/* The pagoda island is a link into the voxel garden.  Place a real <a> over it,
   computed from the framebuffer geometry (the canvas is integer-scaled and
   centre-cropped, so a static CSS box would drift), then clamp it on screen. */
function layoutGardenLink(){
  if(!gardenLink || !cv || !dprNow) return;
  const k = px / dprNow;                        // art px -> CSS px
  const ax = BW * 0.215 - 52;                   // island + pagoda, art px
  const ay = BH - 82;                           // above the finial, down off-frame
  let left = bx / dprNow + ax * k;
  let top  = by / dprNow + ay * k;
  let w = 104 * k;
  let h = (BH - ay) * k;
  const vw = Math.max(240, innerWidth), vh = Math.max(160, innerHeight);
  if(left < 0){ w += left; left = 0; }
  if(top < 0){ h += top; top = 0; }
  if(left + w > vw) w = vw - left;
  if(top + h > vh) h = vh - top;
  // on a heavily cropped portrait window the island is off-screen anyway: no
  // invisible click target, the link is simply not there
  if(w < 28 || h < 28){ gardenLink.style.display = "none"; return; }
  gardenLink.style.display = "block";
  gardenLink.style.left = Math.round(left) + "px";
  gardenLink.style.top = Math.round(top) + "px";
  gardenLink.style.width = Math.round(w) + "px";
  gardenLink.style.height = Math.round(h) + "px";
}

/* =========================================================================
   Focus session — a timekeeper, not a productivity app.  The card carries it;
   no panels, no rings, no notifications.  Deadlines only (wall clock), so a
   hidden tab or a reload lands in the right state.
   ========================================================================= */
const BASE_TITLE = (typeof document !== "undefined" && document.title) || "";
const FOCUS_LENGTHS = [50, 25];              // click the idle row to cycle
const BREAK_MIN = 10;
const session = { kind: "idle", lenMin: 50, endAt: 0, startedAt: 0, marks: 0, endedAt: 0 };

function sessionMinLeft(){
  return Math.max(0, Math.ceil((session.endAt - Date.now()) / 60000));
}
function sessionSave(){
  return { kind: session.kind, lenMin: session.lenMin, endAt: session.endAt, startedAt: session.startedAt, marks: session.marks };
}
function restoreSession(pr){
  if(!pr || typeof pr !== "object") return;
  if(Number.isFinite(pr.lenMin) && pr.lenMin > 0) session.lenMin = pr.lenMin;
  if(Number.isInteger(pr.marks)) session.marks = pr.marks;
  const kind = pr.kind === "focus" || pr.kind === "break" ? pr.kind : "idle";
  const endAt = Number(pr.endAt) || 0;
  if(kind === "idle" || !endAt) return;
  const slack = 120000;                       // two minutes of grace for a reload
  if(endAt < Date.now() - slack){ session.kind = "idle"; session.endAt = 0; return; }
  session.kind = kind;
  session.endAt = endAt;
  session.startedAt = Number(pr.startedAt) || Date.now();
}

function paintSession(){
  const row = document.getElementById("infoSession");
  const play = document.getElementById("infoPlay");
  const now = Date.now();
  let text = "";
  let cls = "";
  if(session.kind === "focus"){
    text = "focus · " + sessionMinLeft() + "m";
  }else if(session.kind === "break"){
    text = "break · " + sessionMinLeft() + "m";
    cls = "break";
  }else if(session.endedAt && now - session.endedAt < 90000){
    const m = Math.round((now - session.endedAt) / 60000);
    text = "break ended " + (m < 1 ? "just now" : m + "m ago");
    cls = "muted";
  }else{
    text = "focus " + session.lenMin + "m";
    cls = "muted";
  }
  if(row){
    row.textContent = text;
    row.className = "row " + cls;
    row.title = session.kind === "idle" ? "Start a " + session.lenMin + " minute session (click to cycle 50/25)"
      : "Stop this session";
  }
  if(play){
    play.textContent = session.kind === "idle" ? "\u25B7" : "\u23F8";
    play.dataset.on = String(session.kind === "focus");
    play.title = session.kind === "idle" ? "Start a focus session (f)" : "Stop (Esc)";
    play.setAttribute("aria-label", session.kind === "idle" ? "Start a focus session" : "Stop the session");
  }
  paintTitle();
}
function paintTitle(){
  if(typeof document === "undefined") return;
  let prefix = "";
  if(session.kind === "focus") prefix = sessionMinLeft() + "m · ";
  else if(session.kind === "break") prefix = "break " + sessionMinLeft() + "m · ";
  document.title = prefix + BASE_TITLE;
}
function playCadence(){
  if(!soundOn || !ac || typeof pluck !== "function") return;
  try{
    const prof = musicProfile();
    const root = prof.chords[0].bass * 2;      // a slow tonic, an octave up
    pluck(root, ac.currentTime + 0.06, prof);
  }catch(e){}
  try{ savePrefs(); }catch(e){}
}
function advanceSession(){
  const now = Date.now();
  if(session.kind === "focus"){
    session.marks++;                           // one mark per completed focus
    session.kind = "break";
    session.startedAt = now;
    session.endAt = now + BREAK_MIN * 60000;
    playCadence();
  }else if(session.kind === "break"){
    session.kind = "idle";
    session.endAt = 0;
    session.endedAt = now;
  }
  try{ savePrefs(); }catch(e){}
}
function tickSession(){
  if(session.kind !== "idle" && session.endAt && Date.now() >= session.endAt) advanceSession();
  paintSession();
}
function startSession(min){
  if(session.kind !== "idle") return false;
  session.lenMin = Number.isFinite(min) && min > 0 ? min : session.lenMin;
  session.kind = "focus";
  session.startedAt = Date.now();
  session.endAt = session.startedAt + session.lenMin * 60000;
  session.endedAt = 0;
  tickSession();
  try{ savePrefs(); }catch(e){}
  return true;
}
function stopSession(){
  session.kind = "idle";
  session.endAt = 0;
  session.endedAt = 0;
  tickSession();
  try{ savePrefs(); }catch(e){}
}
function toggleSession(){
  if(session.kind === "idle") return startSession();
  stopSession();
  return false;
}
function cycleSessionLength(){
  if(session.kind !== "idle") return;
  session.lenMin = session.lenMin === 50 ? 25 : 50;
  session.endedAt = 0;                         // the new length is what you should see
  paintSession();
  try{ savePrefs(); }catch(e){}
}
(function wireSession(){
  const play = document.getElementById("infoPlay");
  const row = document.getElementById("infoSession");
  if(play) play.addEventListener("click", e => { e.stopPropagation(); toggleSession(); });
  if(row) row.addEventListener("click", e => {
    e.stopPropagation();
    if(session.kind === "idle") cycleSessionLength(); else stopSession();
  });
  addEventListener("keydown", e => {
    const t = e.target;
    if(t && /input|textarea|select/i.test(t.tagName || "")) return;
    if(e.key === "f" || e.key === "F"){ e.preventDefault(); toggleSession(); }
    else if(e.key === "Escape"){ if(session.kind !== "idle"){ e.preventDefault(); stopSession(); } }
  });
  addEventListener("pagehide", () => { try{ savePrefs(); }catch(e){} });
  paintSession();
})();

const PIXEL = {

  record(id){ return cityRecord(id); },
  setup(w, h){ allocate(w, h, 1); },
  render(city, hour, opts){
    opts = opts || {};
    if(city && CITY_BY_ID[city]) state.city = city;
    if(hour !== undefined) state.hour = hour;
    if(opts.season !== undefined) state.seasonOverride = opts.season || null;
    refreshSeason();
    if(opts.rain !== undefined){ state.rainAmt = state.rainTarget = opts.rain; }
    if(opts.snow !== undefined){ state.snowAmt = state.snowTarget = opts.snow; }
    if(!snowAllowed()){ state.snowAmt = state.snowTarget = 0; }   // e.g. Sydney summer
    if(opts.cloud !== undefined) state.cloudAmt = opts.cloud;
    buildScene(state.city);          // cached unless city/season/size changed
    buildSill(state.city);
    waterCv = null;
    paintWater();
    const m = moodAt(state.hour);
    paintSky(m);
    skyBucket = Math.round(state.hour * 20) / 20;
    drawFrame(1000, 0.016);
    return buf;
  },
  framebuffer(){ return buf; },
  frame(now){ drawFrame(now || 1000, 0.016); },
  moodAt,
  hemisphereOf,
  seasonOf,
  seasonNow,
  citySeason(id, month){
    const c = cityRecord(id);
    return seasonOf(month === undefined ? localParts(c.tz).month : month, c.lat);
  },
  drift(id, season){ return driftFor(id, season); },
  /* ---- season + tree + bake inspection (all read-only, for the harness) ---- */
  setSeason(season){                    // force a season and repaint once
    state.seasonOverride = season || null;
    return refreshSeason();
  },
  sceneSeason(){ return scene ? scene.season : null; },
  view(){ return { bw: BW, bh: BH, px, bx, by, pad: PAD }; },
  layers(){ return scene ? { far: scene.farC, mid: scene.midC, near: scene.nearC } : null; },
  treeInfo(){ return scene ? scene.treeInfo : null; },
  treeEmitters(){ return scene ? scene.treeEmitters.slice() : []; },
  bakes(){ return { scene: bakeStats.scene, near: bakeStats.near, hits: bakeStats.hits, byCity: Object.assign({}, bakeStats.byCity) }; },
  driftParticles(){ return drift.slice(0, 28); },
  driftSource(){ return scene ? scene.treeInfo : null; },

  /* ---- audio inspection (this is how the port is verified headlessly) ----
     `state` is the AudioContext state ("none" before the first gesture,
     "running" once started), `on` the sound toggle, `profile` the current
     city's music profile name, `rms` a short RMS off the master mix via an
     AnalyserNode, plus the current chord/cutoff/gains for the checks. */
  audio(){
    const prof = musicProfile();
    const ch = musicChord();
    return {
      state: ac ? ac.state : "none",
      ctx: ac ? ac.state : "none",
      on: soundOn,
      armed: gestureArmed,
      city: state.city,
      profile: prof.name,
      rms: audioRms(),
      chord: { bass: ch.bass, pad: ch.pad.slice() },
      chords: prof.chords.map(c => ({ bass: c.bass, pad: c.pad.slice() })),
      hold: prof.hold,
      cutoff: padFilter ? padFilter.frequency.value : prof.cutoff,
      tone: toneFilter ? toneFilter.frequency.value : 18000,
      scale: prof.scale.slice(),
      reverb: { seconds: prof.reverb.seconds, decay: prof.reverb.decay },
      air: prof.air,
      vol,
      gains: {
        master: master ? master.gain.value : 0,
        rain: rainGain ? rainGain.gain.value : 0,
        air: airGain ? airGain.gain.value : 0
      }
    };
  },
  audioProfile(id){
    const p = musicFor(id);
    return {
      id: MUSIC[id] ? id : MUSIC_FALLBACK,
      name: p.name, hold: p.hold, cutoff: p.cutoff, air: p.air, level: p.level,
      reverb: { seconds: p.reverb.seconds, decay: p.reverb.decay, wet: p.reverb.wet },
      pluckEvery: p.pluckEvery.slice(), pluckLevel: p.pluckLevel,
      chords: p.chords.map(c => ({ bass: c.bass, pad: c.pad.slice() })),
      scale: p.scale.slice()
    };
  },
  audioUpdate(){ updateAudio(); return PIXEL.audio(); },
  audioToggle(){ return setSoundOn(!soundOn); },
  session: {
    get(){ return { kind: session.kind, lenMin: session.lenMin, leftMs: Math.max(0, session.endAt - Date.now()),
                    marks: session.marks, title: document.title }; },
    start(min){ return startSession(min); },
    stop(){ stopSession(); },
    tick(){ tickSession(); },
    endIn(ms){ session.endAt = Date.now() + Math.max(0, ms); },
    row(){ const r = document.getElementById("infoSession"); return r ? r.textContent : null; }
  },
  selectCity(id){ if(CITY_BY_ID[id]) setCity(id, true); return state.city; }
};
if(typeof globalThis !== "undefined") globalThis.PIXEL = PIXEL;

if(hasDOM && typeof document.getElementById === "function") boot();
</script>
</body>
</html>
