<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pixel garden — six cities, one view</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#070a0c}
  canvas{position:fixed;inset:0;display:block;image-rendering:pixelated;image-rendering:crisp-edges}

  /* ---- controls live inside the corner card ---- */
  #infoBody .ctl{display:flex;align-items:center;gap:6px;margin-top:5px}
  #infoBody .ctl .lbl{color:#8fa0a9;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;min-width:32px}
  #infoBody .ctl button{padding:4px 7px}
  #infoBody #hour{width:74px}
  #infoBody #vol{width:46px}
  button{font:inherit;color:#c6d2d9;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.11);
      border-radius:8px;padding:5px 8px;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
  button:hover{background:rgba(255,255,255,.13);color:#fff}
  button[aria-pressed="true"]{background:rgba(232,203,132,.17);border-color:rgba(232,203,132,.45);color:#f4e2b4}
  input[type=range]{-webkit-appearance:none;appearance:none;height:3px;border-radius:2px;
      background:rgba(255,255,255,.22);outline:none;cursor:pointer}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;
      background:#e8cb84;box-shadow:0 0 0 4px rgba(232,203,132,.14);cursor:pointer}
  input[type=range]::-moz-range-thumb{width:11px;height:11px;border:0;border-radius:50%;background:#e8cb84}
  #cityBtn{color:#eef3f6}
  #cityMenu{position:fixed;z-index:7;display:flex;flex-direction:column;gap:2px;padding:6px;
      border-radius:12px;background:rgba(10,14,17,.9);border:1px solid rgba(255,255,255,.14);
      backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
      box-shadow:0 14px 34px rgba(0,0,0,.45);min-width:132px}
  #cityMenu[hidden]{display:none}
  #cityMenu button{text-align:left;border:0;background:transparent;color:#c6d2d9;padding:6px 10px;
      border-radius:7px;white-space:nowrap}
  #cityMenu button:hover{background:rgba(255,255,255,.12);color:#fff}
  #cityMenu button[aria-pressed="true"]{color:#f4e2b4;background:rgba(232,203,132,.12)}

  /* ---- corner card (same contract as relax.html) ---- */
  #info{position:fixed;top:14px;left:14px;z-index:6;min-width:172px;
      background:rgba(10,14,17,.62);border:1px solid rgba(255,255,255,.13);border-radius:12px;
      backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
      color:#e6edf1;font:12.5px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;
      box-shadow:0 10px 26px rgba(0,0,0,.3)}
  #infoHead{display:flex;align-items:center;gap:8px;width:100%;padding:8px 11px;
      background:transparent;border:0;color:inherit;font:inherit;cursor:pointer;text-align:left;border-radius:0}
  #infoHead:hover{background:rgba(255,255,255,.07)}
  #infoRefresh{background:transparent;border:0;color:#8798a2;font:inherit;line-height:1;
      padding:1px 3px;margin:0;cursor:pointer;border-radius:6px;display:inline-flex;align-items:center}
  #infoRefresh:hover:not(:disabled){color:#fff;background:rgba(255,255,255,.12)}
  #infoRefresh:disabled{opacity:.28;cursor:default}
  #infoRefresh.spin{animation:info-spin .9s linear infinite}
  @keyframes info-spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion: reduce){ #infoRefresh.spin{animation:none} }
  #infoPlace{flex:auto;color:#c6d2d9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #infoClock{font-variant-numeric:tabular-nums;color:#e8cb84}
  #info .chev{font-size:9px;color:#8798a2;transition:transform .18s}
  #info:not(.closed) .chev{transform:rotate(180deg)}
  #infoBody{padding:0 11px 9px;display:flex;flex-direction:column;gap:3px}
  #info.closed #infoBody{display:none}
  #infoBody .row{display:flex;gap:6px;align-items:baseline}
  #infoPlay{background:transparent;border:0;color:#93a6b3;font:inherit;line-height:1;
      padding:1px 3px;margin:0 2px 0 0;cursor:pointer;border-radius:6px;display:inline-flex;align-items:center}
  #infoPlay:hover{color:#fff;background:rgba(255,255,255,.12)}
  #infoPlay[data-on="true"]{color:#e8cb84}
  #infoSession{color:#e8cb84;font-variant-numeric:tabular-nums;cursor:pointer}
  #infoSession.break{color:#9fd0b8}
  #infoSession.muted{color:#93a6b3}
  #infoBody .muted{color:#8798a2;font-size:11.5px;line-height:1.35}
  @media (max-width:760px){ #info{top:10px;left:10px;min-width:150px} }

  /* ---- the pagoda island is a link into the voxel garden ----
     Sits under the UI (z-index 4 < bar's 5 and card's 6) so it can never eat a
     click meant for the controls; the rectangle itself is placed in JS from the
     framebuffer geometry, so it tracks the island on any window size. */
  #gardenLink{position:fixed;z-index:4;display:block;cursor:pointer;border-radius:8px;
      text-decoration:none;-webkit-tap-highlight-color:transparent}
  #gardenLink .hint{position:absolute;left:50%;bottom:100%;transform:translate(-50%,-7px);
      padding:4px 9px;border-radius:999px;white-space:nowrap;pointer-events:none;

      color:#dfe8ee;font:11.5px/1 system-ui,-apple-system,"Segoe UI",sans-serif;
      letter-spacing:.06em;opacity:0;transition:opacity .16s}
  #gardenLink:hover .hint,#gardenLink:focus-visible .hint{opacity:1}
  #gardenLink:focus-visible{outline:2px solid rgba(232,203,132,.75);outline-offset:3px}
  @media (prefers-reduced-motion: reduce){ #gardenLink .hint{transition:none} }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<a id="gardenLink" href="./voxel-garden/" aria-label="Enter the garden">
  <span class="hint" aria-hidden="true">enter the garden</span>
</a>

<div id="cityMenu" hidden>
  <button data-city="vancouver" aria-pressed="true">Vancouver</button>
  <button data-city="toronto" aria-pressed="false">Toronto</button>
  <button data-city="hawaii" aria-pressed="false">Hawai&lsquo;i</button>
  <button data-city="hongkong" aria-pressed="false">Hong Kong</button>
  <button data-city="amsterdam" aria-pressed="false">Amsterdam</button>
  <button data-city="sydney" aria-pressed="false">Sydney</button>
</div>
<div id="info">
  <div id="infoHead" role="button" tabindex="0" aria-expanded="true" title="Location, weather and time">
    <span id="infoPlace">Vancouver</span>
    <span id="infoClock">--:--</span>
    <button id="infoPlay" aria-label="Start a focus session" title="Start a focus session (f)">&#9655;</button>
    <button id="infoRefresh" aria-label="Refresh weather" title="Refresh weather now">&#8635;</button>
    <span class="chev" aria-hidden="true">&#9660;</span>
  </div>
  <div id="infoBody">
    <div class="row"><span id="infoCond">Clear sky</span><span id="infoTemp"></span></div>
    <div class="row muted" id="infoSeason"></div>
    <div class="row muted" id="infoMeta"></div>
    <div class="row muted" id="infoScene" hidden></div>
    <div class="ctl"><span class="lbl">city</span>
      <button id="cityBtn" aria-haspopup="true" aria-expanded="false" title="Change city">Vancouver &#9662;</button></div>
    <div class="ctl" style="margin-bottom:2px"><span class="lbl">sound</span>
      <button id="snd" aria-pressed="false" title="Ambient sound">sound</button>
      <input id="vol" type="range" min="0" max="1" step="0.01" value="0.18" aria-label="Volume"></div>
    <div class="row" id="infoSession"></div>
  </div>
</div>

<script>
"use strict";

/* =========================================================================
   Pixel garden — a low-resolution framebuffer drawn like pixel art, full bleed.
   Everything below paints into a ~480x270 art-pixel buffer using flat
   rectangles, per-pixel ordered dithering (4x4 Bayer) and image blits.
   No paths, no gradients: that keeps it honest pixel art and keeps the frame
   cheap enough to run at 60fps.
   ========================================================================= */

/* ------------------------------------------------------------------ utils */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp  = (a, b, t) => a + (b - a) * t;

function mulberry32(a){
  return function(){
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ordered 4x4 Bayer matrix (values 0..15) — the whole dithering look comes from this
const BAYER = [0,8,2,10, 12,4,14,6, 3,11,1,9, 15,7,13,5];
const bay = (x, y) => BAYER[((y & 3) << 2) | (x & 3)];

const colCache = new Map();
function hex2rgb(h){
  const n = parseInt(h.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function rgbArrStr(c){ return "rgb(" + (c[0] | 0) + "," + (c[1] | 0) + "," + (c[2] | 0) + ")"; }
function withA(h, a){
  const c = hex2rgb(h);
  return "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + a.toFixed(3) + ")";
}
function mixCol(a, b, t){                    // hex + hex -> rgb string
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  const key = a + b + (t * 64 | 0);
  let v = colCache.get(key);
  if(v) return v;
  const A = hex2rgb(a), B = hex2rgb(b);
  v = rgbArrStr([lerp(A[0], B[0], t), lerp(A[1], B[1], t), lerp(A[2], B[2], t)]);
  colCache.set(key, v);
  return v;
}
function darken(h, f){
  const c = hex2rgb(h);
  return rgbArrStr([c[0] * f, c[1] * f, c[2] * f]);
}
function lighten(h, f){
  const c = hex2rgb(h);
  return rgbArrStr([lerp(c[0], 255, f), lerp(c[1], 255, f), lerp(c[2], 255, f)]);
}

/* ------------------------------------------------------------- DOM helpers */
const hasDOM = typeof document !== "undefined" && typeof document.createElement === "function";
function makeCanvas(w, h){
  const c = document.createElement("canvas");
  c.width  = Math.max(1, Math.round(w));
  c.height = Math.max(1, Math.round(h));
  return c;
}
const ctx2 = c => c.getContext("2d");

/* a rectangle is the only drawing primitive we allow ourselves */
function R(g, x, y, w, h, col){
  if(w <= 0 || h <= 0) return;
  g.fillStyle = col;
  g.fillRect(Math.round(x), Math.round(y), Math.max(1, Math.round(w)), Math.max(1, Math.round(h)));
}

/* ------------------------------------------------------------ mood table */
// copied verbatim from relax.html: keyframes are sky top/bottom, a multiply
// tint, and a night amount.  h in 0..24.
const MOOD = [
  { h: 0.0,  top: [7, 11, 24],    bot: [17, 27, 45],    tint: [28, 40, 84],   ta: 0.76, night: 1.00 },
  { h: 4.6,  top: [24, 30, 54],   bot: [64, 52, 80],    tint: [64, 56, 104],  ta: 0.62, night: 0.85 },
  { h: 6.4,  top: [152, 172, 206],bot: [244, 208, 182], tint: [255, 190, 150],ta: 0.20, night: 0.18 },
  { h: 9.0,  top: [178, 210, 232],bot: [238, 244, 246], tint: [255, 250, 240],ta: 0.05, night: 0.00 },
  { h: 13.0, top: [188, 220, 240],bot: [240, 246, 244], tint: [255, 255, 255],ta: 0.00, night: 0.00 },
  { h: 16.8, top: [200, 214, 236],bot: [251, 236, 212], tint: [255, 226, 186],ta: 0.12, night: 0.00 },
  { h: 18.6, top: [112, 100, 138],bot: [240, 164, 122], tint: [255, 152, 104],ta: 0.34, night: 0.24 },
  { h: 20.4, top: [22, 32, 54],   bot: [34, 46, 70],    tint: [36, 50, 100],  ta: 0.72, night: 0.90 },
  { h: 24.0, top: [7, 11, 24],    bot: [17, 27, 45],    tint: [28, 40, 84],   ta: 0.76, night: 1.00 }
];

function moodAt(h){
  h = ((h % 24) + 24) % 24;
  let i = 0;
  while(i < MOOD.length - 2 && h > MOOD[i + 1].h) i++;
  const a = MOOD[i], b = MOOD[i + 1];
  const t = (h - a.h) / Math.max(1e-6, b.h - a.h);
  const mix = (p, q) => [lerp(p[0], q[0], t), lerp(p[1], q[1], t), lerp(p[2], q[2], t)];
  return {
    top: mix(a.top, b.top), bot: mix(a.bot, b.bot), tint: mix(a.tint, b.tint),
    ta: lerp(a.ta, b.ta, t), night: lerp(a.night, b.night, t)
  };
}

/* --------------------------------------------------------------- palettes */
// 14-16 colours per city.  Everything painted into the layers comes from here;
// the mood tint is applied once, on top of the whole frame, so the palette is
// simply multiplied towards the hour's colour and stays limited.
const PAL = {
  vancouver: {
    mtnFar:"#8ea5a8", mtnFarHi:"#aec0c1", snow:"#e6eeee", mist:"#c9d6d7",
    mtn:"#45625a", mtnHi:"#5b7d70", fir:"#22382e", firHi:"#31503f", firLo:"#152419",
    tower:"#3b4d56", towerHi:"#5a6f76", towerLo:"#24333a",
    win:"#e8b564", water:"#173440", waterHi:"#2c5d6c", waterLo:"#0c2029", whale:"#0f1e24",
    // the near tree's four seasonal colour sets (petals / foliage / amber / bark)
    tree: {
      trunk:"#3b2a20", branch:"#5a4433", snow:"#e9f1f2",
      spring:{ c:"#f2bfd0", hi:"#fbe3ec", lo:"#cf8fa6", dot:"#fff4f8" },
      summer:{ c:"#2f4a38", hi:"#466b4d", lo:"#22382e", dot:"#3c5b45" },
      autumn:{ c:"#c88a3a", hi:"#e0a94e", lo:"#96602c", dot:"#d89a34" },
      winter:{ c:"#6b4a35", hi:"#8a6648", lo:"#4a3325", dot:"#e9f1f2" }
    }
  },
  toronto: {
    haze:"#c6b192", shore:"#8b8372", shoreHi:"#a69d8a",
    twr1:"#4b4237", twr2:"#3a342c", twr3:"#5d5346", twrHi:"#7c705f",
    cn:"#6f6659", cnHi:"#928776",
    maple:"#c07a2c", maple2:"#d89a34", mapleR:"#a8452a", trunk:"#3b2a20",
    water:"#274a5e", waterHi:"#3f6e83", waterLo:"#152e3c", win:"#ffd08a",
    tree: {
      trunk:"#3b2a20", branch:"#5b4534", snow:"#eaf1f2",
      spring:{ c:"#f6dbe4", hi:"#fdf0f4", lo:"#e5b9ca", dot:"#ffffff" },
      summer:{ c:"#4d6b3f", hi:"#6d8a52", lo:"#374e2d", dot:"#5c7d48" },
      autumn:{ c:"#c07a2c", hi:"#d89a34", lo:"#a8452a", dot:"#e0a94e" },
      winter:{ c:"#6a5848", hi:"#84705c", lo:"#4b3d32", dot:"#eaf1f2" }
    }
  },
  hawaii: {
    ridge:"#3d353d", ridgeHi:"#5e5259", ridgeLo:"#282229", haze:"#c9b7b2",
    sand:"#d9c48c", sandLo:"#bda874", sandHi:"#efdfb2",
    lava:"#241f24", palm:"#2c4030", palmHi:"#47683f", palmLo:"#1b2a1e",
    lagoon:"#1f6f78", lagoonHi:"#3fa0a0", lagoonLo:"#124a55",
    pink:"#e0576f", cream:"#f2e6d0",
    // a hibiscus/plumeria shrub: evergreen in the tropics, so winter keeps a
    // crown (fewer, paler blooms) instead of going bare
    tree: {
      trunk:"#3f3026", branch:"#5a4636", snow:"#eef2f0",
      spring:{ c:"#e88fa0", hi:"#f6cfd8", lo:"#cf6a7e", dot:"#f6e8d4" },
      summer:{ c:"#47683f", hi:"#618a52", lo:"#2c4030", dot:"#f2e6d0" },
      autumn:{ c:"#6f7a3e", hi:"#93a052", lo:"#4c5528", dot:"#e8b3aa" },
      winter:{ c:"#3a5240", hi:"#4e6b50", lo:"#26382a", dot:"#f4cfc8" }
    }
  },
  hongkong: {
    hill:"#1b3b40", hillHi:"#2a545a",
    t1:"#17323a", t2:"#1e424b", t3:"#26525c", tHi:"#3c6c74",
    neon:"#e0303a", neon2:"#ff6a4a", amber:"#ffc25e", win:"#ffd08a",
    water:"#0f2a33", waterHi:"#245a66", waterLo:"#081a20",
    haze:"#7d99a2", sail:"#a83a30",
    // bauhinia: orchid-pink blossom in spring, dense green summer, a little
    // autumn colour, and a bare-ish subtropical winter
    tree: {
      trunk:"#2b2320", branch:"#453630", snow:"#e9f1f2",
      spring:{ c:"#d886b6", hi:"#efc2da", lo:"#a8558a", dot:"#f7dcea" },
      summer:{ c:"#3b5a44", hi:"#527a58", lo:"#283e2e", dot:"#6f944f" },
      autumn:{ c:"#a87a3a", hi:"#c99a4e", lo:"#7a5528", dot:"#d8a552" },
      winter:{ c:"#5a4636", hi:"#75604c", lo:"#3d3028", dot:"#e9f1f2" }
    }
  },
  amsterdam: {
    brickA:"#8f3f2e", brickB:"#a9563c", brickC:"#c07050", brickD:"#d9c6a8",
    roof:"#463630", roofLo:"#2b2320", trim:"#ece0c8", door:"#3f3026",
    canal:"#2c5142", canalHi:"#4b7f68", canalLo:"#19312a",
    gold:"#d8a552", tulipR:"#d24b6a", tulipY:"#e8b23c", leaf:"#3d5a3a", elm:"#4d6b46",
    // the canal-side elm: fresh samara green in spring, deep green summer,
    // amber autumn, bare winter
    tree: {
      trunk:"#3b3028", branch:"#55463a", snow:"#e9f1f2",
      spring:{ c:"#a8c47a", hi:"#c9e0a0", lo:"#7fa15c", dot:"#e8e2b0" },
      summer:{ c:"#3d5a3a", hi:"#587a4c", lo:"#2c4229", dot:"#4d6b46" },
      autumn:{ c:"#a8762e", hi:"#c99a44", lo:"#7c5522", dot:"#d8a552" },
      winter:{ c:"#5c4c3c", hi:"#77654f", lo:"#41352a", dot:"#e9f1f2" }
    }
  },
  sydney: {
    haze:"#b9c9cf", farHill:"#7d98a0", farHillHi:"#9ab2b8", farLo:"#5c7680",
    tower:"#5c7480", towerHi:"#7e96a0", towerLo:"#3b4f59", win:"#ffd79a",
    steel:"#5d6975", steelHi:"#8b98a3", steelLo:"#39434d",
    stone:"#a2967f", stoneHi:"#c2b69d", stoneLo:"#6d6455",
    sail:"#f2efe3", sailHi:"#ffffff", sailLo:"#cfc9b8", shellShadow:"#b7b0a0",
    podium:"#8a6a52", grass:"#4c6b45", grassHi:"#6b8b57",
    sand:"#d9c79c", sandHi:"#efdfb2",
    jac:"#8b7fbd", jacHi:"#a99dd6", jacLo:"#5f5686", bark:"#3a3129",
    ferry:"#e8e6dc", ferryGreen:"#2f6b52",
    water:"#1b4453", waterHi:"#2f6a7d", waterLo:"#0d2530",
    // southern hemisphere, so the crown runs inverted: purple blossom in
    // spring (Oct), green summer, thinned olive autumn, bare-ish winter
    tree: {
      trunk:"#3a3129", branch:"#54473c", snow:"#eef2f0",
      spring:{ c:"#8b7fbd", hi:"#a99dd6", lo:"#5f5686", dot:"#c8c0e8" },
      summer:{ c:"#4c6b45", hi:"#6b8b57", lo:"#375032", dot:"#7fa15c" },
      autumn:{ c:"#7e8450", hi:"#9aa066", lo:"#5f6538", dot:"#b0a060" },
      winter:{ c:"#6a5a48", hi:"#88765f", lo:"#4c4034", dot:"#eef2f0" }
    }
  }
};

/* ------------------------------------------------------------ city records
   One record per city.  Everything that differs between cities lives here:
   the palette, the landmark art key, the clock zone, the coordinates for the
   Open-Meteo fetch, the drift key, any per-city rules (Sydney has no snow in
   its summer), and the near/mid `tree` spec that is the source of the drift.
   The builders way below are just a table keyed by landmark.

   `tree`: one species per city, baked into a layer with four seasonal crowns:
     kind    species label (documentation + harness)
     layer   "near" or "mid" (which baked layer it belongs to)
     x       frame x as a fraction of BW; an array means a small group of
             trunks of the same species (Toronto's maples, Sydney's jacarandas)
     baseY   trunk foot as a fraction of BH (0.665 == the waterline)
     h       trunk height in art px at the 480x270 reference size (array ok)
     form    silhouette: w/h crown box, cluster count, trunk width, lean
     crowns  per season: { w,h } size multipliers, `dots` bloom count,
             `gap` for the sky holes in autumn, or `bare: true` for winter
   The crown colours themselves live in PAL[city].tree[season]. */
const CITIES = [
  {
    id: "vancouver", name: "Vancouver", seed: 11,
    lat: 49.2827, lon: -123.1207, tz: "America/Vancouver",
    palette: PAL.vancouver, landmark: "vancouver", drift: "vancouver",
    // a cherry on the far shore: blossom in spring, then a dark fir-green
    // canopy (its summer drift is fir needles), amber autumn, bare winter
    tree: {
      kind: "cherry", layer: "mid", x: 0.79, baseY: 0.665, h: 38,
      form: { w: 28, h: 26, clusters: 3, trunk: 2, lean: -2, shape: "broad" },
      crowns: {
        spring: { w: 1.00, h: 0.95, dots: 9, lift: 0.55 },
        summer: { w: 1.06, h: 1.05, dots: 0, lift: 0.55 },
        autumn: { w: 0.96, h: 0.90, dots: 3, gap: 0.55, lift: 0.55 },
        winter: { bare: true, twig: 0.85 }
      }
    }
  },
  {
    id: "toronto", name: "Toronto", seed: 23,
    lat: 43.6532, lon: -79.3832, tz: "America/Toronto",
    palette: PAL.toronto, landmark: "toronto", drift: "toronto",
    // the two maples on the near island bank, moved into the tree system
    tree: {
      kind: "maple", layer: "mid", x: [0.72, 0.84], baseY: 0.665, h: [38, 30],
      form: { w: 29, h: 27, clusters: 3, trunk: 2, lean: 1, shape: "broad" },

/* --------------------------------------------------------------- seasons
   Hemisphere-aware: the same calendar month is a different season below the
   equator.  The month comes from the city's *local* date through Intl, so in
   October Toronto is in autumn and Sydney is in spring. */
const SEASONS = ["spring", "summer", "autumn", "winter"];   // March-first
function hemisphereOf(lat){ return lat < 0 ? "south" : "north"; }
function seasonOf(month, lat){
  // month 1..12: Mar-May spring, Jun-Aug summer, Sep-Nov autumn, Dec-Feb winter;
  // the southern hemisphere is that shifted by two seasons.
  if(!Number.isFinite(month)) month = 1;
  const m = (((Math.round(month) - 3) % 12) + 12) % 12;
  const idx = Math.floor(m / 3);
  const flip = hemisphereOf(lat) === "south" ? 2 : 0;
  return SEASONS[(idx + flip) % 4];
}
function localParts(tz){
  try{
    const parts = new Intl.DateTimeFormat("en-GB", {
      timeZone: tz, year: "numeric", month: "2-digit", day: "2-digit",
      hour: "2-digit", minute: "2-digit", hour12: false
    }).formatToParts(new Date());
    const get = t => Number((parts.find(p => p.type === t) || {}).value);
    return { year: get("year"), month: get("month"), day: get("day"),
             hour: get("hour") % 24, minute: get("minute") };
  }catch(e){
    const d = new Date();
    return { year: d.getFullYear(), month: d.getMonth() + 1, day: d.getDate(),
             hour: d.getHours(), minute: d.getMinutes() };
  }
}
function localHour(tz){
  const p = localParts(tz);
  return p.hour + p.minute / 60;
}
function seasonNow(id){
  const c = cityRecord(id || state.city);
  return seasonOf(localParts(c.tz).month, c.lat);
}

/* the season that city is actually in right now (local date + latitude).
   This is also the one place a season rollover is noticed: when state.season
   changes the baked scene is rebuilt once (the tree gets its new crown), and
   every later frame blits the cached layers.  Same one-off cost as a city
   switch, at most four times a session. */
function refreshSeason(){
  const c = cityRecord(state.city);
  const next = state.seasonOverride || seasonOf(localParts(c.tz).month, c.lat);
  const changed = next !== state.season;
  state.season = next;
  if(changed && scene && scene.id === state.city) buildScene(state.city);
  return state.season;
}
/* Some cities have a season in which snow simply cannot happen (Sydney in its
   December summer).  Everything that can set weather goes through this. */
function snowAllowed(season){
  const c = cityRecord(state.city);
  const s = season || state.season || "winter";
  return !c.noSnow || c.noSnow.indexOf(s) < 0;
}

/* ------------------------------------------------------------------ sprites */
/* a tiny bitmap font of pixels: rows of characters, a colour map */
function drawBits(g, bits, map, x, y, scale){
  scale = scale || 1;
  for(let r = 0; r < bits.length; r++){
    const row = bits[r];
    for(let c = 0; c < row.length; c++){
      const ch = row[c];
      if(ch === "." || ch === " ") continue;
      const col = map[ch];
      if(!col) continue;
      R(g, x + c * scale, y + r * scale, scale, scale, col);
    }
  }
}

/* =========================================================================
   Baked city art.  Each city paints three transparent layer canvases that are
   wider than the framebuffer (PAD art px either side) so they can be blitted at
   a slowly drifting offset for parallax.  They are built once per city/resize:
   a frame only blits them, which is why 60fps is easy.
   ========================================================================= */

const rgbCache = new Map();
function rgbOf(h){
  let v = rgbCache.get(h);
  if(!v){ v = hex2rgb(h); rgbCache.set(h, v); }
  return v;
}
function rgbA(h, a){ const c = rgbOf(h); return [c[0], c[1], c[2], a]; }

/* cyclic smoothed noise, used for ridge lines and forest edges */
function smoothNoise(rnd, n, passes){
  let a = new Float32Array(n);
  for(let i = 0; i < n; i++) a[i] = rnd() * 2 - 1;
  for(let p = 0; p < passes; p++){
    const b = new Float32Array(n);
    for(let i = 0; i < n; i++) b[i] = (a[(i - 1 + n) % n] + a[i] * 2 + a[(i + 1) % n]) * 0.25;
    a = b;
  }
  return a;
}

/* A dithered alpha band, rendered per-pixel into a throwaway canvas: this is how
   haze, mist and glints stay in the same ordered-dither language as the sky. */
function ditherBand(w, h, fn){
  const c = makeCanvas(w, h), g = ctx2(c);
  const img = g.createImageData(w, h), d = img.data;
  for(let y = 0; y < h; y++){
    for(let x = 0; x < w; x++){
      const col = fn(x, y);
      if(!col) continue;
      const i = (y * w + x) * 4;
      d[i] = col[0]; d[i+1] = col[1]; d[i+2] = col[2]; d[i+3] = col[3];
    }
  }
  g.putImageData(img, 0, 0);
  return c;
}

/* --------------------------------------------------------------- buildings */
function drawTower(s, gName, g, x, baseY, w, h, body, hi, lo, glass, opt){
  opt = opt || {};
  const pal = s.pal;
  R(g, x, baseY - h, w, h, body);
  R(g, x, baseY - h, 1, h, hi);                       // lit left arris
  if(w > 2) R(g, x + w - 1, baseY - h + 1, 1, h - 1, lo);
  R(g, x, baseY - h, w, 1, hi);                       // top cap
  R(g, x - 1, baseY - h - 1, w + 2, 1, hi);

  const step = opt.winStep || 3;
  const litChance = opt.lit === undefined ? 0.5 : opt.lit;
  for(let yy = baseY - h + 3; yy < baseY - 2; yy += step){
    for(let xx = x + 2; xx <= x + w - 2; xx += 3){
      if((((xx * 5 + yy * 11) >> 1) & 3) === 0) continue;    // irregular mullions
      R(g, xx, yy, 1, 1, glass);                             // glass in daylight
      if(s.rnd() < litChance && s.windows.length < 520)
        addWin(s, gName, xx, yy, 1, 1, opt.litCol || pal.win, opt.dim || 1);
    }
  }
  if(opt.crown){                                   // stepped crown on the tall ones
    const cw = Math.max(3, Math.round(w * 0.62));
    R(g, x + Math.round((w - cw) / 2), baseY - h - 5, cw, 4, body);
    R(g, x + Math.round((w - cw) / 2), baseY - h - 5, cw, 1, hi);
    if(opt.crown > 1){
      const cw2 = Math.max(2, Math.round(w * 0.3));
      R(g, x + Math.round((w - cw2) / 2), baseY - h - 9, cw2, 4, body);
      R(g, x + Math.round((w - cw2) / 2), baseY - h - 9, cw2, 1, hi);
    }
  }
  if(opt.antenna) R(g, x + Math.floor(w / 2), baseY - h - 1 - opt.antenna, 1, opt.antenna, lo);
  s.props.push({ g: gName, x, w, h, col: body });
}

function addWin(s, g, x, y, w, h, col, dim){
  const r = s.rnd();
  s.windows.push({ g, x, y, w, h, col, dim: dim || 1,
                   ph: r * 6.283, per: 7 + s.rnd() * 24, bias: s.rnd() });
}

/* ------------------------------------------------------------------- trees */
function coniferFringe(s, g, yBase, base, amp, colA, colB, colC){
  const n = smoothNoise(s.rnd, s.LW, 2);
  for(let x = 0; x < s.LW; x++){
    const h = Math.round(base + n[x] * amp + Math.sin(x * 0.037) * amp * 0.5);
    if(h < 3) continue;
    R(g, x, yBase - h, 1, h + 3, colA);
    if((x & 3) === 0) R(g, x, yBase - h - 2, 1, 3, colB);   // tree spike
    if((x & 7) === 3) R(g, x, yBase - h - 1, 1, 2, colC);
  }
}

function palm(s, g, x, baseY, h, lean, trunk, frond, frondHi, shadow){
  let tipX = x, tipY = baseY - h;
  for(let r = 0; r < h; r++){
    const t = r / h;
    const dx = Math.round(lean * t * t * 11);
    const w = r > h * 0.7 ? 1 : 2;
    R(g, x + dx, baseY - r, w, 1, trunk);
    if(w === 2 && (r & 1) === 0) R(g, x + dx + 1, baseY - r, 1, 1, shadow);
    tipX = x + dx + 1; tipY = baseY - r;
  }
  R(g, x - 1, baseY - 1, 4, 1, shadow);
  const cx = tipX, cy = tipY - 1;
  for(let i = 0; i < 8; i++){
    const a = -2.72 + i * 0.40 + (s.rnd() - 0.5) * 0.14;
    const len = 7 + Math.round(s.rnd() * 5);
    for(let k = 1; k <= len; k++){
      const fx = cx + Math.cos(a) * k * 1.45;
      const fy = cy + Math.sin(a) * k * 0.8 + k * k * 0.11;
      const thick = k < len * 0.35 ? 2 : 1;
      R(g, fx, fy, thick, 1, k < len * 0.55 ? frondHi : frond);
    }
  }
  R(g, cx - 1, cy, 3, 2, frond);
  R(g, cx - 1, cy + 2, 2, 1, frond);
  R(g, cx, cy + 2, 1, 1, shadow);
}

/* --------------------------------------------------------------- houses (AMS) */
function gableHouse(s, g, x, baseY, w, h, body, roof, trim, door, type){
  const shadeL = lighten(body, 0.12), shadeR = darken(body, 0.74);
  R(g, x, baseY - h, w, h, body);
  R(g, x, baseY - h, 1, h, shadeL);
  R(g, x + w - 1, baseY - h, 1, h, shadeR);
  R(g, x, baseY - 2, w, 2, darken(body, 0.6));         // plinth
  R(g, x, baseY - h - 1, w, 1, trim);                  // white cornice
  let topY = baseY - h - 1;

  if(type === 0){                                       // stepped gable
    let sw = w;
    for(let i = 0; i < 4; i++){
      sw = Math.max(4, sw - 4);
      topY -= 3;
      const sx = x + Math.round((w - sw) / 2);
      R(g, sx, topY, sw, 3, i === 3 ? roof : body);
      R(g, sx, topY, sw, 1, i === 3 ? trim : shadeL);
      if(i === 3) R(g, sx, topY + 3, sw, 1, trim);
    }
    R(g, x + Math.round(w / 2) - 1, topY - 2, 2, 2, trim);
  } else if(type === 1){                                // bell gable
    for(let i = 1; i <= 4; i++){
      const ww = Math.max(4, Math.round(w * (0.98 - i * 0.19)));
      topY -= 2;
      const sx = x + Math.round((w - ww) / 2);
      R(g, sx, topY, ww, 2, i === 4 ? roof : body);
      R(g, sx, topY, ww, 1, i === 4 ? roof : trim);
      R(g, sx, topY, 1, 2, shadeL);
    }
  } else {                                              // neck gable with a spout
    R(g, x - 1, topY - 2, w + 2, 2, roof);
    R(g, x - 1, topY - 2, w + 2, 1, trim);
    R(g, x + Math.round(w / 2) - 2, topY - 7, 5, 5, body);
    R(g, x + Math.round(w / 2) - 2, topY - 7, 5, 1, trim);
    R(g, x + Math.round(w / 2) - 1, topY - 9, 3, 2, roof);
  }
  // windows: 1-2 columns of 4x6 glass in a 1px white frame
  const cols = w >= 30 ? 2 : 1;
  for(let yy = topY + 11; yy < baseY - 11; yy += 11){
    for(let c = 0; c < cols; c++){
      const wx = x + (cols === 1 ? Math.round(w / 2) - 3 : 5 + c * (w - 14));
      if(wx + 6 > x + w - 2) continue;
      R(g, wx, yy, 6, 8, trim);
      R(g, wx + 1, yy + 1, 4, 6, door);
      R(g, wx + 1, yy + 4, 4, 1, trim);
      if(s.rnd() < 0.5 && s.windows.length < 520)
        addWin(s, "mid", wx + 1, yy + 1, 4, 6, s.gold || s.pal.gold, 1);
    }
  }
  // door with a step
  const dx = x + Math.round(w / 2) - 2;
  R(g, dx, baseY - 8, 5, 8, door);
  R(g, dx, baseY - 8, 5, 1, trim);
  R(g, dx + 3, baseY - 5, 1, 1, trim);
  R(g, dx - 1, baseY - 1, 7, 1, trim);
  s.props.push({ g: "mid", x, w, h: Math.min(h, 40), col: body });
}

/* =========================================================== city builders */
const BUILD = {};

/* a rounded canopy, drawn as spans so it does not read as a stack of boxes */
function blob(g, cx, cy, rx, ry, col, hi){
  for(let y = -ry; y <= ry; y++){
    const t = y / (ry + 0.5);
    const halfW = Math.round(rx * Math.sqrt(Math.max(0, 1 - t * t)));
    if(halfW <= 0) continue;
    R(g, cx - halfW, cy + y, halfW * 2, 1, col);
  }
  if(!hi) return;
  for(let y = -ry; y <= -Math.round(ry * 0.15); y++){
    const t = y / (ry + 0.5);
    const halfW = Math.round(rx * Math.sqrt(Math.max(0, 1 - t * t)));
    if(halfW > 3) R(g, cx - halfW + 1, cy + y, halfW - 2, 1, hi);
  }
}

/* ------------------------------------------------ Vancouver: ridge + firs */
BUILD.vancouver = function(s){
  const p = s.pal, Y = s.yW, LW = s.LW, H = s.BH;
  const F = (x,y,w,h,c) => R(s.far, x, y, w, h, c);
  const M = (x,y,w,h,c) => R(s.mid, x, y, w, h, c);
  const N = (x,y,w,h,c) => R(s.near, x, y, w, h, c);

  // ---- distant coastal range: angular peaks under snow, paling with distance
  const n1 = smoothNoise(s.rnd, LW, 3);
  const farPeaks = [
    { c: 4,   h: 66,  w: 92 }, { c: 112, h: 104, w: 96 }, { c: 224, h: 84, w: 88 },
    { c: 330, h: 114, w: 98 }, { c: 444, h: 82, w: 90 },  { c: 528, h: 72, w: 82 }
  ];
  const ridgeA = x => {
    let h = 0;
    for(let i = 0; i < farPeaks.length; i++){
      const pk = farPeaks[i], d = Math.abs(x - pk.c) / pk.w;
      if(d < 1) h = Math.max(h, pk.h * (1 - d));
    }
    return h + n1[x] * 3;
  };
  for(let x = 0; x < LW; x++){
    const h = Math.round(ridgeA(x));
    if(h < 3) continue;
    const y = Y - h;
    F(x, y, 1, h + 3, p.mtnFar);
    if(h > Math.round(ridgeA(x - 2)) + 1) F(x, y, 1, Math.min(3, h), p.mtnFarHi);
    if(h > 76){
      const cap = Math.round(3 + (h - 76) * 0.5);
      for(let r = 0; r < cap; r++) if(bay(x, y + r) < 16 - r * 3) F(x, y + r, 1, 1, p.snow);
    }
  }

  // ---- nearer ridge, greener, with conifer tips on the skyline
  const n2 = smoothNoise(s.rnd, LW, 2);
  const nearPeaks = [{ c: 52, h: 48, w: 132 }, { c: 196, h: 62, w: 140 },
                     { c: 358, h: 54, w: 150 }, { c: 506, h: 44, w: 120 }];
  const ridgeB = x => {
    let h = 0;
    for(let i = 0; i < nearPeaks.length; i++){
      const pk = nearPeaks[i], d = Math.abs(x - pk.c) / pk.w;
      if(d < 1) h = Math.max(h, pk.h * (1 - d));
    }
    return h + n2[x] * 5;
  };
  for(let x = 0; x < LW; x++){
    const h = Math.round(ridgeB(x));
    if(h < 3) continue;
    const y = Y - h;
    F(x, y, 1, h + 3, p.mtn);
    if(h > Math.round(ridgeB(x - 2)) + 1) F(x, y, 1, Math.min(2, h), p.mtnHi);
    if((x & 3) === 0) F(x, y - 2, 1, 3, p.fir);
    if((x & 7) === 3) F(x, y - 1, 1, 2, p.firLo);
  }

  // ---- mist pooled along the waterline
  const mist = ditherBand(LW, 44, (x, y) =>
    bay(x, y + 6) < Math.round((y / 44) * 11) ? rgbA(p.mist, 255) : null);
  s.far.globalAlpha = 0.4;
  s.far.drawImage(mist, 0, Y - 44);
  s.far.globalAlpha = 1;

  // ---- forest fringe and a slim downtown behind it
  coniferFringe(s, s.mid, Y, 20, 12, p.firLo, p.fir, p.firHi);
  const towers = [[-80, 10, 26], [-64, 12, 40], [-46, 10, 32], [-26, 13, 50], [-7, 9, 28], [8, 8, 20]];
  for(let i = 0; i < towers.length; i++){
    const t = towers[i];
    drawTower(s, "mid", s.mid, Math.round(s.cx + t[0]), Y, t[1], t[2],
              i % 2 ? p.tower : p.towerLo, p.towerHi, p.towerLo,
              darken(p.towerHi, 0.88), { winStep: 3, lit: 0.38, litCol: p.win });
  }
  // ---- wet rocks, kept to the right so the garden owns the left corner
  const rocks = [[LW - 96, 30, 9], [LW - 62, 22, 7], [LW - 34, 28, 11], [LW - 12, 36, 9]];
  for(let i = 0; i < rocks.length; i++){
    const r = rocks[i];
    N(r[0], H - r[2], r[1], r[2], p.firLo);
    N(r[0], H - r[2], r[1], 2, p.fir);
    N(r[0] + 2, H - r[2] - 2, Math.round(r[1] * 0.4), 2, p.fir);
  }
  s.extra.whale = { x: Math.round(s.BW * 0.62) };
};

/* ------------------------------------------------------- Toronto: the tower */
BUILD.toronto = function(s){
  const p = s.pal, Y = s.yW, LW = s.LW, H = s.BH;
  const F = (x,y,w,h,c) => R(s.far, x, y, w, h, c);
  const M = (x,y,w,h,c) => R(s.mid, x, y, w, h, c);
  const N = (x,y,w,h,c) => R(s.near, x, y, w, h, c);

  // ---- hazy far shore, low skyline, warm
  const haze = ditherBand(LW, 40, (x, y) =>
    bay(x, y + 12) < Math.round(Math.pow(y / 40, 1.25) * 12) ? rgbA(p.haze, 255) : null);
  s.far.globalAlpha = 0.5;
  s.far.drawImage(haze, 0, Y - 40);
  s.far.globalAlpha = 1;
  F(0, Y - 2, LW, 4, p.shore);
  for(let i = 0; i < 34; i++){
    const x = Math.round(i * 15.6 + s.rnd() * 5);
    const w = 3 + Math.round(s.rnd() * 5), h = 4 + Math.round(s.rnd() * 14);
    F(x, Y - 2 - h, w, h + 3, p.shore);
    if(s.rnd() < 0.5) F(x, Y - 2 - h, w, 1, p.shoreHi);
    if(s.rnd() < 0.35) F(x + 1, Y - 4 - Math.round(s.rnd() * h * 0.6), 1, 1, p.win);
  }

  // ---- skyline: warm greys with one stepped crown, kept below the tower
  const sky = [
    [-112, 15, 40], [-92, 12, 54], [-70, 18, 46], [-36, 13, 60],
    [4, 16, 50], [26, 14, 64], [92, 16, 44], [114, 12, 56], [136, 17, 38]
  ];
  for(let i = 0; i < sky.length; i++){
    const t = sky[i];
    drawTower(s, "mid", s.mid, Math.round(s.cx + t[0]), Y, t[1], t[2],
              i % 3 === 0 ? p.twr1 : i % 3 === 1 ? p.twr2 : p.twr3,
              p.twrHi, darken(p.twr2, 0.8), darken(p.twr3, 0.6),
              { winStep: 3, lit: 0.42, litCol: p.win, crown: i === 5 ? 1 : 0 });
  }
  // Rogers Centre dome, squat and pale
  const dx0 = Math.round(s.cx + 48);
  for(let r = 0; r < 12; r++){
    const w = Math.round(34 * Math.sqrt(1 - r / 12.5));
    M(dx0 - w / 2, Y - r - 1, w, 1, r > 8 ? p.shoreHi : p.shore);
  }
  // CN Tower: shaft, pod, antenna
  const cx = Math.round(s.cx - 28);
  M(cx, Y - 118, 3, 118, p.cn);
  M(cx, Y - 118, 1, 118, p.cnHi);
  M(cx - 5, Y - 123, 13, 5, p.cn);
  M(cx - 5, Y - 123, 13, 1, p.cnHi);
  M(cx - 6, Y - 126, 15, 3, p.cn);
  M(cx - 6, Y - 126, 15, 1, p.cnHi);
  M(cx + 1, Y - 134, 1, 11, p.cn);
  M(cx - 1, Y - 142, 5, 8, p.cnHi);
  M(cx + 1, Y - 150, 1, 8, p.cn);
  addWin(s, "mid", cx + 1, Y - 122, 1, 2, p.win, 1.4);
  addWin(s, "mid", cx + 2, Y - 125, 1, 1, p.win, 1.4);

  // ---- near: island bank on the right; the maples on it are drawn by the
  // tree system (city.tree) after the landmark art, with seasonal crowns
  const bankTop = H - 15;
  const bankX = Math.round(LW * 0.68);
  N(bankX, bankTop, LW - bankX + 12, 15, p.trunk);
  N(bankX, bankTop, LW - bankX + 12, 1, p.shore);
  N(bankX + 10, bankTop + 4, 40, 1, p.shoreHi);
  N(bankX + 62, bankTop + 5, 34, 1, p.shoreHi);
};

/* -------------------------------------------- Hawai'i: Diamond Head + palms */
BUILD.hawaii = function(s){
  const p = s.pal, Y = s.yW, LW = s.LW, H = s.BH;
  const F = (x,y,w,h,c) => R(s.far, x, y, w, h, c);
  const M = (x,y,w,h,c) => R(s.mid, x, y, w, h, c);
  const N = (x,y,w,h,c) => R(s.near, x, y, w, h, c);

  // haze first, so it does not wash the ridge out
  const hz = ditherBand(LW, 34, (x, y) =>
    bay(x, y + 3) < Math.round(Math.pow(y / 34, 1.3) * 12) ? rgbA(p.haze, 255) : null);
  s.far.globalAlpha = 0.45;
  s.far.drawImage(hz, 0, Y - 34);
  s.far.globalAlpha = 1;

  // Diamond Head: long west slope, flat top, a notch, seaward cliffs on the east
  // Diamond Head: long west slope, dead-flat crown, a notch, a steep seaward cliff
  const dh = x => {
    if(x < -60 || x > 300) return 0;
    if(x < 44) return Math.round(68 * Math.pow((x + 60) / 104, 0.9));
    if(x < 96) return 68;
    if(x < 110) return 68 - Math.round((x - 96) * 1.15);
    if(x < 124) return 52 + Math.round((x - 110) * 0.85);
    if(x < 194) return 64;
    if(x < 238) return Math.round(64 * Math.pow((238 - x) / 44, 1.6));
    return 0;
  };
  for(let x = 0; x < LW; x++){
    const h = Math.max(0, Math.round(dh(x)));
    if(h < 2) continue;
    const y = Y - h;
    F(x, y, 1, h + 3, p.ridge);
    if(dh(x) - dh(x - 2) < 1.5) F(x, y, 1, 2, p.ridgeHi);
  }
  // facet the cone: lit west slopes, shaded seaward cliff, bright crown
  for(let x = 0; x < LW; x++){
    const h = Math.max(0, Math.round(dh(x)));
    if(h < 3) continue;
    const slope = dh(x) - dh(x - 3);
    const y = Y - h;
    if(slope > 1.2){
      for(let yy = y + 2; yy < Y; yy += 3) if(bay(x, yy) < 9) F(x, yy, 1, 1, p.ridgeHi);
    } else if(slope < -1.2){
      for(let yy = y + 2; yy < Y; yy += 2) if(bay(x, yy) < 8) F(x, yy, 1, 1, p.ridgeLo);
    } else {
      F(x, y, 1, 2, p.ridgeHi);
    }
  }
  // shadow pooled at the foot, plus a haze wash so the cone sits in the sea air
  for(let x = 0; x < LW; x++){
    const h = Math.max(0, Math.round(dh(x)));
    if(h > 20) F(x, Y - 9, 1, 10, p.ridgeLo);
  }
  const basemist = ditherBand(LW, 18, (x, y) =>
    bay(x, y + 4) < Math.round(Math.pow(y / 18, 1.4) * 11) ? rgbA(p.haze, 255) : null);
  s.far.globalAlpha = 0.34;
  s.far.drawImage(basemist, 0, Y - 18);
  s.far.globalAlpha = 1;
  // a low headland far right
  for(let x = 336; x < LW; x++){
    const h = Math.round(13 + Math.sin((x - 336) * 0.05) * 6);
    if(h > 2) F(x, Y - h, 1, h + 2, p.ridgeLo);
  }

  // beach: a wider band of sand with a dithered soft edge above it
  const beach = ditherBand(LW, 9, (x, y) =>
    BAYER[((y & 3) << 2) | (x & 3)] / 16 < Math.pow(y / 9, 1.6) * 0.8 ? rgbA(p.sandHi, 255) : null);
  s.mid.drawImage(beach, 0, Y - 9);
  M(0, Y - 5, LW, 8, p.sand);
  M(0, Y - 6, LW, 1, p.sandHi);
  for(let i = 0; i < 18; i++){
    const x = Math.round(s.rnd() * LW), w = 2 + Math.round(s.rnd() * 4);
    M(x, Y - 1 - Math.round(s.rnd() * 2), w, 2, p.lava);
  }
  for(let i = 0; i < 14; i++){
    const x = Math.round(s.rnd() * LW), y = Y - 3 - Math.round(s.rnd() * 2);
    M(x, y, 2, 2, p.pink);
    M(x, y, 1, 1, p.cream);
  }
  // hale: dark walls under a steep thatch roof
  const hx = Math.round(s.cx + 62);
  M(hx, Y - 9, 18, 9, p.lava);
  M(hx + 7, Y - 6, 4, 6, p.palmLo);
  M(hx - 3, Y - 12, 24, 3, p.palmHi);
  M(hx - 1, Y - 15, 20, 3, p.palm);
  M(hx + 4, Y - 17, 10, 2, p.palmHi);
  M(hx + 8, Y - 18, 3, 1, p.palmLo);

  const palms = [[64, 30, -1], [96, 44, -1], [132, 28, -1], [176, 38, -1],
                 [338, 34, 1], [382, 46, 1], [430, 30, 1], [478, 40, 1], [516, 32, 1]];
  for(let i = 0; i < palms.length; i++){
    const pl = palms[i];
    palm(s, s.mid, pl[0], Y - 1, pl[1], pl[2], p.palmLo, p.palm, p.palmHi, p.lava);
  }

  // near: the shallow lagoon shelf along the bottom edge
  N(0, H - 6, LW, 6, p.lagoonLo);
  N(0, H - 6, LW, 1, p.lagoon);
};

/* --------------------------------------------- Hong Kong: dense tower wall */
BUILD.hongkong = function(s){
  const p = s.pal, Y = s.yW, LW = s.LW, H = s.BH;
  const F = (x,y,w,h,c) => R(s.far, x, y, w, h, c);
  const M = (x,y,w,h,c) => R(s.mid, x, y, w, h, c);
  const N = (x,y,w,h,c) => R(s.near, x, y, w, h, c);

  // the Peak, and a stipple of towers on it
  for(let x = 0; x < LW; x++){
    const h = Math.round(50 + Math.sin(x * 0.0125) * 20 + Math.sin(x * 0.031 + 1.6) * 8);
    if(h > 2) F(x, Y - h, 1, h + 3, p.hill);
  }
  for(let i = 0; i < 40; i++){
    const x = Math.round(s.rnd() * LW);
    const w = 3 + Math.round(s.rnd() * 6);
    const hillH = 50 + Math.sin(x * 0.0125) * 20 + Math.sin(x * 0.031 + 1.6) * 8;
    const h = 6 + Math.round(s.rnd() * 20);
    F(x, Y - hillH - h + 5, w, h, p.hill);
    if(s.rnd() < 0.4) F(x, Y - hillH - h + 5, w, 1, p.hillHi);
    if(s.rnd() < 0.45) F(x + 1, Y - hillH - 4, 1, 1, p.amber);
  }
  const haze = ditherBand(LW, 44, (x, y) =>
    bay(x, y + 9) < Math.round((y / 44) * 9) ? rgbA(p.haze, 255) : null);
  s.far.globalAlpha = 0.34;
  s.far.drawImage(haze, 0, Y - 44);
  s.far.globalAlpha = 1;

  // the wall: stepped crowns, antennas, vertical neon
  const towers = [
    [-120, 20, 70, 0, 0], [-98, 13, 94, 2, 1], [-78, 21, 60, 0, 0], [-54, 15, 108, 2, 2],
    [-32, 19, 82, 1, 1], [-10, 13, 54, 0, 0], [9, 21, 122, 2, 2], [35, 15, 72, 1, 1],
    [55, 18, 96, 2, 0], [80, 13, 64, 0, 0], [98, 21, 106, 1, 1], [124, 15, 78, 0, 2]
  ];
  for(let i = 0; i < towers.length; i++){
    const t = towers[i];
    const x = Math.round(s.cx + t[0]), w = t[1], h = t[2], crown = t[3], style = t[4];
    const body = i % 3 === 0 ? p.t1 : i % 3 === 1 ? p.t2 : p.t3;
    drawTower(s, "mid", s.mid, x, Y, w, h, body, p.tHi, darken(p.t1, 0.7), darken(p.t2, 0.52),
              { winStep: 3, lit: 0.5, litCol: i % 2 ? p.win : p.amber,
                crown: crown, antenna: style === 1 ? 12 : 0 });
    if(style === 2){                                   // stepped shoulder, set back
      drawTower(s, "mid", s.mid, x + Math.round(w * 0.22), Y, Math.round(w * 0.56), Math.round(h * 0.9),
                body, p.tHi, darken(p.t1, 0.7), darken(p.t2, 0.52),
                { winStep: 4, lit: 0.35, litCol: p.amber });
    }
    if(style === 0){                                   // neon sign slab
      M(x + 2, Y - h + 13, 2, 15, p.neon);
      M(x + 2, Y - h + 13, 2, 2, p.neon2);
      M(x + 2, Y - h + 32, 2, 8, p.amber);
      s.lights.push({ kind: "neon", x: x + 2, y: Y - h + 13, w: 2, h: 15, col: p.neon, ph: s.rnd() * 6.3 });
    } else if(style === 1){
      M(x + w - 4, Y - h + 22, 2, 11, p.neon2);
      s.lights.push({ kind: "neon", x: x + w - 4, y: Y - h + 22, w: 2, h: 11, col: p.neon2, ph: s.rnd() * 6.3 });
    }
  }
  for(let i = 0; i < 30; i++) M(Math.round(s.rnd() * LW), Y - 1, 1, 1, p.amber);

  s.extra.junk = { x: Math.round(s.BW * 0.72), y: Y + 26 };
  s.lights.push({ kind: "lantern", x: 44, y: 20, col: p.neon, ph: 0 });
  s.lights.push({ kind: "lantern", x: s.BW - 58, y: 28, col: p.neon, ph: 2.1 });
};

/* ------------------------------------------ Amsterdam: gables, canal, bridge */
BUILD.amsterdam = function(s){
  const p = s.pal, Y = s.yW, LW = s.LW, H = s.BH;
  const F = (x,y,w,h,c) => R(s.far, x, y, w, h, c);
  const M = (x,y,w,h,c) => R(s.mid, x, y, w, h, c);
  const N = (x,y,w,h,c) => R(s.near, x, y, w, h, c);
  const SX = x => Math.round(x) + PAD;               // buffer x -> near layer x

  // distant rooftops and a church spire, faded
  for(let x = -12; x < LW; x += 10){
    const h = 10 + Math.round(s.rnd() * 13);
    F(x, Y - h, 8, h + 2, p.brickD);
    F(x + 1, Y - h - 3, 5, 3, p.roofLo);
    if(s.rnd() < 0.4) F(x + 2, Y - h + 4, 1, 2, p.door);
  }
  const spx = Math.round(s.cx + 96);
  F(spx, Y - 54, 2, 54, p.brickD);
  F(spx - 4, Y - 44, 10, 8, p.brickD);
  F(spx - 2, Y - 58, 6, 4, p.brickD);
  F(spx - 1, Y - 62, 4, 4, p.roofLo);
  const hz = ditherBand(LW, 50, (x, y) =>
    bay(x, y + 5) < Math.round((y / 50) * 12) ? rgbA(p.brickD, 255) : null);
  s.far.globalAlpha = 0.46;
  s.far.drawImage(hz, 0, Y - 50);
  s.far.globalAlpha = 1;

  // the gabled row: six narrow houses with real gaps between them
  const row = [
    [-126, 26, 40, 0, p.brickA], [-98, 30, 50, 1, p.brickB],
    [-64, 24, 36, 2, p.brickC], [-36, 32, 54, 0, p.brickB],
    [0, 26, 42, 1, p.brickA],   [30, 24, 34, 2, p.brickD],
    [58, 30, 48, 0, p.brickC],  [92, 26, 38, 1, p.brickA]
  ];
  for(let i = 0; i < row.length; i++){
    const r = row[i];
    gableHouse(s, s.mid, Math.round(s.cx + r[0]), Y, r[1], r[2], r[4], p.roof, p.trim, p.door, r[3]);
  }
  // the two elms in the gable gaps are drawn by the tree system (city.tree)
  // after this builder, so their crown follows the season

  // near: a low bridge across the far end of the canal, arches in shadow
  const by0 = Y + 3, bh = 9;
  const arches = [52, 136, 220, 304, 388, 472];
  for(let r = 0; r < bh; r++){
    const openings = [];
    if(r >= 1){
      const q = (bh - 1 - r) / (bh - 2);
      const hw = Math.round(16 * Math.sqrt(Math.max(0, 1 - q * q)));
      if(hw > 0) for(let a = 0; a < arches.length; a++) openings.push([arches[a] - hw, arches[a] + hw]);
    }
    openings.sort((a, b) => a[0] - b[0]);
    let x = 0;
    for(let a = 0; a < openings.length; a++){
      if(openings[a][0] > x) N(x, by0 + r, openings[a][0] - x, 1, r < 1 ? darken(p.brickB, 0.6) : darken(p.brickB, 0.84));
      N(openings[a][0], by0 + r, openings[a][1] - openings[a][0], 1, r === 1 ? p.trim : p.canalLo);
      x = Math.max(x, openings[a][1]);
    }
    if(x < LW) N(x, by0 + r, LW - x, 1, r < 1 ? darken(p.brickB, 0.6) : darken(p.brickB, 0.84));
  }
  N(0, by0, LW, 1, p.brickD);                        // coping
  N(0, by0 + 1, LW, 1, darken(p.brickB, 0.55));
  N(0, by0 + bh - 1, LW, 1, p.roofLo);               // wet foot
  for(let x = 4; x < LW; x += 16) N(x, by0 - 7, 1, 7, p.trim);
  N(0, by0 - 8, LW, 1, p.trim);
  N(0, by0 - 7, LW, 1, darken(p.brickB, 0.5));

  // a houseboat and a loaded barge in the canal in front of the bridge
  const bx = SX(s.BW * 0.60), by = Y + 36;
  N(bx, by, 36, 4, p.roofLo);
  N(bx + 1, by, 36, 1, p.canalHi);
  N(bx + 3, by - 6, 24, 7, p.brickD);
  N(bx + 3, by - 6, 24, 1, p.trim);
  N(bx + 7, by - 4, 4, 3, p.door);
  N(bx + 13, by - 4, 4, 3, p.door);
  N(bx + 19, by - 4, 4, 3, p.door);
  N(bx + 27, by - 3, 6, 4, p.brickA);
  s.props.push({ g: "near", x: bx - PAD, w: 36, h: 9, col: p.brickD });
  const gx = SX(s.BW * 0.79), gy = Y + 48;
  N(gx, gy, 42, 3, p.roofLo);
  N(gx, gy, 42, 1, p.canalHi);
  N(gx + 4, gy - 4, 8, 4, p.trim);
  N(gx + 16, gy - 5, 12, 5, p.brickC);
  N(gx + 30, gy - 3, 6, 3, p.door);
};

/* --------------------------------- Sydney: the sails and the arch over the harbour */
BUILD.sydney = function(s){
  const p = s.pal, Y = s.yW, LW = s.LW, H = s.BH;
  const F = (x,y,w,h,c) => R(s.far, x, y, w, h, c);
  const M = (x,y,w,h,c) => R(s.mid, x, y, w, h, c);
  const N = (x,y,w,h,c) => R(s.near, x, y, w, h, c);

  // ---- far: the north shore as a low blue-grey ridge under a sea haze
  const n1 = smoothNoise(s.rnd, LW, 3);
  for(let x = 0; x < LW; x++){
    const h = Math.round(10 + n1[x] * 6 + Math.sin(x * 0.019 + 2.2) * 4);
    if(h < 2) continue;
    F(x, Y - h, 1, h + 2, p.farHill);
    if((x & 3) === 0) F(x, Y - h, 1, 2, p.farHillHi);
    if((x & 31) === 7) F(x, Y - h - 4, 1, 4, p.farLo);      // the odd mast or roof
  }
  // a low far shore under the arch: roofs, and a window or two
  for(let x = -20; x < 356; x += 7){
    const h = 3 + Math.round(s.rnd() * 5);
    F(x, Y - h, 6, h + 2, p.farLo);
    if(s.rnd() < 0.4) F(x + 1, Y - h - 2, 4, 2, p.farHill);
    if(s.rnd() < 0.25) F(x + 2, Y - h + 1, 1, 1, p.win);
  }
  // the distant CBD behind the Opera House, pale and low so the sails read
  const cbd = [[296, 9, 20], [310, 12, 30], [326, 10, 24], [340, 14, 36],
               [358, 9, 20], [372, 12, 30], [390, 10, 24], [404, 13, 34],
               [420, 8, 18], [432, 11, 26], [450, 10, 22], [462, 12, 30]];
  for(let i = 0; i < cbd.length; i++){
    const t = cbd[i];
    // only the towers clear of the sails get lit windows: the window pass draws
    // after the grade, so a window behind an opaque sail would shine through it
    drawTower(s, "far", s.far, t[0], Y - 1, t[1], t[2],
              i % 3 === 0 ? p.tower : p.towerLo, p.towerHi, p.towerLo,
              darken(p.tower, 0.78), { winStep: 4, lit: t[0] >= 412 ? 0.24 : 0, litCol: p.win });
  }
  const hz = ditherBand(LW, 34, (x, y) =>
    bay(x, y + 4) < Math.round(Math.pow(y / 34, 1.3) * 11) ? rgbA(p.haze, 255) : null);
  s.far.globalAlpha = 0.44;
  s.far.drawImage(hz, 0, Y - 34);
  s.far.globalAlpha = 1;

  // ---- mid: the Harbour Bridge.  Deck runs off the left edge to a sandstone
  // abutment on the point; a steel arch and two granite pylons span the water.
  const deckY = Y - 36;
  const deckL = -24, deckR = 286;
  const archL = 36, archR = 262;
  const archMid = (archL + archR) / 2, archHalf = (archR - archL) / 2;
  const apexY = deckY - 50;
  const archYAt = x => {
    const d = (x - archMid) / archHalf;
    return Math.round(apexY + (deckY - apexY) * d * d);
  };
  M(deckL, deckY, deckR - deckL, 3, p.steel);               // deck
  M(deckL, deckY, deckR - deckL, 1, p.steelHi);
  for(let x = deckL + 2; x < deckR; x += 7) M(x, deckY + 3, 1, 2, p.steelLo);
  M(deckL, deckY + 5, deckR - deckL, 1, p.steelLo);
  for(let x = archL; x <= archR; x++){                      // arch + hangers
    const ay = archYAt(x);
    if(ay >= deckY) continue;
    M(x, ay, 1, 2, p.steel);
    M(x, ay, 1, 1, p.steelHi);
    if(((x - archL) % 12) === 0 && deckY - ay > 4)
      M(x, ay + 2, 1, deckY - ay - 2, p.steelLo);
  }
  const pylon = (x, topY) => {
    const w = 15, baseY = Y + 2;
    M(x, topY, w, baseY - topY, p.stone);
    M(x, topY, 2, baseY - topY, p.stoneHi);
    M(x + w - 2, topY, 2, baseY - topY, p.stoneLo);
    M(x - 2, topY - 3, w + 4, 3, p.stone);
    M(x - 2, topY - 3, w + 4, 1, p.stoneHi);
    M(x + 3, topY - 7, w - 6, 4, p.stone);
    M(x + 3, topY - 7, w - 6, 1, p.stoneHi);
    for(let yy = topY + 4; yy < baseY - 3; yy += 6) M(x + 3, yy, w - 6, 1, p.stoneLo);
    s.props.push({ g: "mid", x, w, h: 26, col: p.stone });
  };
  pylon(archL - 15, Y - 64);
  pylon(archR, Y - 64);
  // deck lamps and a beacon on each pylon: the bridge's own night life
  for(let x = deckL + 14; x < deckR - 8; x += 26)
    addWin(s, "mid", x, deckY - 1, 1, 1, "#ffe0a8", 1.15);
  addWin(s, "mid", archL - 8, Y - 70, 1, 1, "#ffd08a", 1.3);
  addWin(s, "mid", archR + 7, Y - 70, 1, 1, "#ffd08a", 1.3);

  // the abutment: sandstone rising out of the water where the deck lands
  for(let x = 268; x <= 306; x++){
    const t = (x - 268) / 38;
    const h = Math.round(30 - t * 7 + Math.sin(x * 0.17) * 1.2);
    M(x, Y - h, 1, h + 3, p.stone);
    M(x, Y - h, 1, 2, p.stoneHi);
    if(x % 7 === 0) M(x, Y - h + 3, 1, h, p.stoneLo);
  }

  // ---- the Opera House: sandstone podium, glazed foyer, four leaning shells
  const opX = 284, opBase = Y - 3;
  M(opX + 4, opBase - 5, 116, 5, p.stone);
  M(opX + 4, opBase - 5, 116, 1, p.stoneHi);
  M(opX, opBase - 2, 124, 2, p.stoneLo);
  M(opX + 8, opBase - 10, 104, 2, p.sailLo);
  M(opX + 8, opBase - 10, 104, 1, p.sail);
  s.props.push({ g: "mid", x: opX - 2, w: 126, h: 10, col: p.sailLo });
  const shell = (x, w, h, lean) => {
    for(let r = 0; r < h; r++){
      const t = r / (h - 1);
      const width = Math.max(2, Math.round(w * Math.pow(1 - t, 0.70)));
      const xo = Math.round(x + (w - width) * 0.5 + lean * Math.pow(t, 1.7) * 9);
      const yy = opBase - 10 - r;
      M(xo, yy, width, 1, t > 0.74 ? p.sailHi : p.sail);
      if(width > 3){
        M(xo, yy, 1, 1, p.sailHi);
        M(xo + width - 1, yy, 1, 1, p.shellShadow);
      }
    }
    s.props.push({ g: "mid", x, w, h, col: p.sail });
  };
  shell(opX + 4, 48, 36, 2);
  shell(opX + 30, 62, 50, 3);
  shell(opX + 66, 46, 38, 2);
  shell(opX + 94, 30, 26, 1);
  // the foyer glows through the glazed line at night
  for(let x = opX + 16; x < opX + 96; x += 13)
    addWin(s, "mid", x, opBase - 9, 3, 1, "#ffe0b0", 0.9);

  // ---- near: a sandstone quay on the right, jacarandas, a scrap of beach
  const bankX = Math.round(LW * 0.63), bankH = 19;
  for(let x = bankX - 36; x < LW; x++){
    const h = bankH + Math.round(Math.sin(x * 0.09 + 1.1) * 2);
    const top = H - h;
    N(x, top, 1, h, p.stone);
    N(x, top, 1, 2, p.stoneHi);
    if(x % 9 === 0) N(x, top + 3, 1, h - 3, p.stoneLo);
    if((x & 1) === 0) N(x, H - 3, 1, 3, p.sand);            // sand at the water
  }
  N(bankX - 36, H - 21, 3, 21, p.stoneLo);
  // the jacarandas on the quay are drawn by the tree system (city.tree) after
  // this builder, with a purple spring / green summer / thinned autumn crown
  // a beach umbrella and a towel on the quay: the summer corner of the season table
  const ux = bankX + 50, utop = H - bankH - 13;
  N(ux, utop, 1, 13, p.stoneLo);
  N(ux - 4, utop, 9, 2, "#d24b6a");
  N(ux - 3, utop - 2, 7, 2, p.sail);
  N(ux + 2, utop - 4, 1, 2, p.stoneLo);
  N(ux - 16, H - bankH + 2, 9, 2, "#e8b23c");

  s.extra.ferry = { x: Math.round(s.BW * 0.60) };
};



/* =========================================================================
   The source trees.  One species per city is specified on the city record
   (city.tree) and baked into the near or mid layer with four seasonal crowns;
   the same bake returns the crown emitter points the drift layer falls from.
   Silhouette first: a trunk and a crown mass have to read at 480x270, colour
   comes second from PAL[city].tree[season].

   The winter crown is bare branches.  Its settled-snow pass is baked into a
   small sprite canvas (`scene.treeSnow`) so a live snowfall can fade it in
   with one drawImage, without a re-bake when the weather changes.
   ========================================================================= */
const SEASON_ORDER = ["spring", "summer", "autumn", "winter"];
const TREE_REF_W = 480;                // tree specs are authored at this buffer width

function treeRnd(seed, season){
  return mulberry32(seed * 131 + SEASON_ORDER.indexOf(season) * 977 + 7);
}
function unionBox(a, b){
  if(!a) return b; if(!b) return a;
  const x = Math.min(a.x, b.x), y = Math.min(a.y, b.y);
  return { x, y, w: Math.max(a.x + a.w, b.x + b.w) - x, h: Math.max(a.y + a.h, b.y + b.h) - y };
}

/* a 1px line primitive: the only way to draw a branch, and cheap */
function branchSeg(g, x0, y0, x1, y1, thick, col){
  const steps = Math.max(1, Math.round(Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0))));
  for(let i = 0; i <= steps; i++){
    const t = i / steps;
    R(g, x0 + (x1 - x0) * t, y0 + (y1 - y0) * t, thick, 1, col);
  }
}

/* one crown cluster: base colour, lit top-left, shaded foot, a few flecks —
   enough shading to read as a canopy instead of a flat disc */
function crownCluster(g, cx, cy, rx, ry, cols){
  const spans = [];
  for(let y = -ry; y <= ry; y++){
    const t = y / (ry + 0.5);
    const halfW = Math.round(rx * Math.sqrt(Math.max(0, 1 - t * t)));
    if(halfW <= 0) continue;
    spans.push([y, halfW]);
    R(g, cx - halfW, cy + y, halfW * 2, 1, cols.c);
  }
  for(let i = 0; i < spans.length; i++){
    const y = spans[i][0], halfW = spans[i][1];
    if(y > -ry * 0.18) break;
    if(halfW > 2) R(g, cx - halfW + 1, cy + y, Math.max(1, Math.round(halfW * 1.4)), 1, cols.hi);
  }
  for(let i = 0; i < spans.length; i++){
    const y = spans[i][0], halfW = spans[i][1];
    if(y < ry * 0.42) continue;
    if(halfW > 1) R(g, cx - halfW + 1, cy + y, Math.max(1, halfW), 1, cols.lo);
  }
  for(let k = 0; k < 5; k++){                    // deterministic leaf flecks
    const a = k * 2.399, rr = Math.sqrt((k + 0.5) / 5);
    R(g, cx + Math.round(Math.cos(a) * rx * rr * 0.8),
         cy + Math.round(Math.sin(a) * ry * rr * 0.8), 1, 1, (k & 1) ? cols.hi : cols.lo);
  }
}

/* the crown's cluster layout, per silhouette.  Returns float boxes so the
   caller can derive both the art and the emitter/crown bounds from one list.
   `form` here is already scaled to the current buffer width.  Five clusters
   stacked around a taller main lobe, so the mass reads round-ish instead of as
   a flat mushroom. */
function crownClusters(form, crown){
  const rx = Math.max(4, (form.w || 24) * (crown.w == null ? 1 : crown.w) * 0.5);
  const ry = Math.max(4, (form.h || 15) * (crown.h == null ? 1 : crown.h) * 0.5);
  const shape = form.shape || "broad";
  const list = [];
  if(shape === "tall"){
    list.push([0, ry * 0.20, rx * 0.80, ry * 0.95]);
    list.push([-rx * 0.38, ry * 0.52, rx * 0.62, ry * 0.66]);
    list.push([rx * 0.36, ry * 0.42, rx * 0.60, ry * 0.62]);
    list.push([0, -ry * 0.55, rx * 0.72, ry * 0.78]);
    list.push([-rx * 0.20, -ry * 0.05, rx * 0.55, ry * 0.55]);
  } else if(shape === "shrub"){
    list.push([0, ry * 0.10, rx * 0.95, ry * 0.90]);
    list.push([-rx * 0.68, ry * 0.30, rx * 0.62, ry * 0.70]);
    list.push([rx * 0.68, ry * 0.26, rx * 0.62, ry * 0.68]);
    list.push([-rx * 0.20, -ry * 0.55, rx * 0.66, ry * 0.62]);
    list.push([rx * 0.24, -ry * 0.50, rx * 0.60, ry * 0.60]);
  } else {
    list.push([0, ry * 0.12, rx * 0.85, ry * 0.92]);
    list.push([-rx * 0.62, ry * 0.26, rx * 0.62, ry * 0.70]);
    list.push([rx * 0.62, ry * 0.20, rx * 0.60, ry * 0.68]);
    list.push([-rx * 0.30, -ry * 0.55, rx * 0.60, ry * 0.66]);
    list.push([rx * 0.32, -ry * 0.58, rx * 0.58, ry * 0.62]);
  }
  return { list, rx, ry };
}

/* blossom / flower dots scattered inside the crown ellipse */
function crownDots(g, cx, cy, rx, ry, dot, n, rnd){
  for(let k = 0; k < n; k++){
    const a = rnd() * 6.283, rr = Math.sqrt(rnd()) * 0.86;
    const x = Math.round(cx + Math.cos(a) * rx * rr);
    const y = Math.round(cy + Math.sin(a) * ry * rr);
    R(g, x, y, rnd() < 0.35 ? 2 : 1, 1, dot);
  }
}

/* one trunk (+ crown or bare limbs).  bx/baseY are buffer coords; the layer
   canvases are PAD px wider, so drawing happens at bx + PAD. */
function drawOneTree(s, g, bx, by, h, scale, form, crown, cols, treeCol, rnd){
  const X = bx + PAD;
  const lean = form.lean || 0;
  const fw = (form.w || 24) * scale, fh = (form.h || 15) * scale;
  const { list, rx, ry } = crownClusters({ shape: form.shape, w: fw, h: fh }, crown);
  const lift = crown.lift == null ? 0.5 : crown.lift;
  const cx = X, cy = by - h - Math.round(ry * lift);
  const emitters = [], snowPts = [], tips = [];
  let box, crownBox = null;

  // root flare
  R(g, X - 3, by - 2, 7, 2, treeCol.trunk);
  R(g, X - 2, by - 4, 5, 2, treeCol.trunk);
  R(g, X - 1, by - 6, 3, 2, treeCol.trunk);

  if(form.shape === "shrub"){
    // a shrub is multi-stemmed: three stems fan out of the same root
    branchSeg(g, X, by - 2, X - Math.round(rx * 0.55), cy + Math.round(ry * 0.42), 1, treeCol.trunk);
    branchSeg(g, X, by - 2, X + Math.round(rx * 0.55), cy + Math.round(ry * 0.36), 1, treeCol.trunk);
    branchSeg(g, X, by - 2, X + Math.round(lean), cy + Math.round(ry * 0.10), 2, treeCol.trunk);
  } else {
    // trunk: 3px at the foot tapering to 1px at the fork, lit right arris
    for(let r = 0; r <= h; r++){
      const t = r / Math.max(1, h);
      const dx = Math.round(lean * t * t);
      const w = t < 0.48 ? 3 : t < 0.84 ? 2 : 1;
      R(g, X + dx, by - r, w, 1, treeCol.trunk);
      if(w > 1) R(g, X + dx + w - 1, by - r, 1, 1, treeCol.branch);
    }
  }
  const forkX = X + Math.round(lean), forkY = by - h;

  if(crown.bare){
    // ---- bare winter: five main limbs, each forking three times into 1px twigs
    const bry = Math.max(10, Math.round(fh * 1.55));
    let minX = X - 3, maxX = X + 3, minY = forkY;
    const grow = (x0, y0, ang, len, thick, depth) => {
      const x1 = x0 + Math.cos(ang) * len;
      const y1 = y0 - Math.sin(ang) * len;
      branchSeg(g, x0, y0, x1, y1, thick, depth > 0 ? treeCol.branch : treeCol.trunk);
      minX = Math.min(minX, x1); maxX = Math.max(maxX, x1); minY = Math.min(minY, y1);
      snowPts.push([x1, y1]);
      if(depth <= 0){ tips.push([x1, y1]); return; }
      grow(x1, y1, ang + 0.38 + rnd() * 0.24, len * 0.62, 1, depth - 1);
      grow(x1, y1, ang - 0.36 - rnd() * 0.24, len * 0.62, 1, depth - 1);
    };
    for(let i = 0; i < 5; i++){
      const ang = Math.PI / 2 + (i - 2) * 0.44 + (rnd() - 0.5) * 0.16;
      grow(forkX, forkY + 1, ang, bry * (i === 2 ? 0.52 : 0.44), i === 2 ? 2 : 1, 3);
    }
    // a bare-ish species may keep a couple of tufts (Sydney's jacaranda)
    if(crown.tuft){
      for(let k = 0; k < crown.tuft && tips.length; k++){
        const tp = tips[(k * 7 + 1) % tips.length];
        R(g, tp[0] - 1, tp[1] - 1, 3, 2, cols.c);
        R(g, tp[0] - 1, tp[1] - 1, 2, 1, cols.hi);
      }
    }
    // 2-3 branch tips are the winter emitters (unused today: every winter
    // drift spec is null, but the tree stays a legal source)
    const sorted = tips.slice().sort((a, b) => a[0] - b[0]);
    const picks = sorted.length > 2 ? [sorted[0], sorted[Math.floor(sorted.length / 2)], sorted[sorted.length - 1]] : sorted;
    for(let i = 0; i < picks.length; i++)
      emitters.push({ x: Math.round(picks[i][0] - PAD), y: Math.round(picks[i][1]), spread: 2 });
    box = { x: Math.round(minX - PAD) - 2, y: Math.round(minY) - 2,
            w: Math.round(maxX - minX) + 5, h: Math.round(by - minY) + 4 };
    crownBox = box;
  } else {
    // ---- crowned seasons: a cluster mass sitting on the fork
    if(form.shape !== "shrub"){
      // two limbs up into the crown, and two lower side limbs whose tips peek
      // out below the skirt (a tree, not a lollipop)
      branchSeg(g, forkX, forkY, cx - rx * 0.30, cy + ry * 0.55, 2, treeCol.branch);
      branchSeg(g, forkX, forkY, cx + rx * 0.28, cy + ry * 0.50, 2, treeCol.branch);
      branchSeg(g, forkX, forkY + 1, cx - rx * 1.02, cy + ry * 1.00, 1, treeCol.trunk);
      branchSeg(g, forkX, forkY + 1, cx + rx * 1.00, cy + ry * 0.94, 1, treeCol.trunk);
      branchSeg(g, forkX, forkY + 1, cx - rx * 0.55, cy + ry * 1.10, 1, treeCol.trunk);
    }
    let minX = X - 4, maxX = X + 4, minY = cy;
    // the two side lobes are painted in a half-shade so the mass has internal
    // edges without reading as separate grapes
    const sideCols = { c: mixCol(cols.c, cols.lo, 0.45), hi: cols.c, lo: cols.lo, dot: cols.dot };
    for(let i = 0; i < list.length; i++){
      const k = list[i];
      const bxc = cx + k[0], byc = cy + k[1];
      crownCluster(g, bxc, byc, k[2], k[3], (i === 1 || i === 2) ? sideCols : cols);
      minX = Math.min(minX, bxc - k[2]); maxX = Math.max(maxX, bxc + k[2]);
      minY = Math.min(minY, byc - k[3]);
    }
    // a few leaf clumps outside the ellipse so the silhouette is not a disc
    for(let k = 0; k < 9; k++){
      const a = k * 0.79 + rnd() * 0.5;
      const rr = 0.92 + rnd() * 0.18;
      const bx2 = cx + Math.cos(a) * rx * rr, by2 = cy + Math.sin(a) * ry * rr;
      R(g, bx2, by2, 1 + (k & 1), 1, (k & 1) ? cols.c : cols.lo);
      minX = Math.min(minX, bx2 - 1); maxX = Math.max(maxX, bx2 + 1);
      minY = Math.min(minY, by2); 
    }
    // sky holes: punch a few gaps so autumn reads as thinned-out
    if(crown.gap){
      const n = Math.round(4 + crown.gap * 12);
      for(let k = 0; k < n; k++){
        const gx = Math.round(cx + (rnd() * 2 - 1) * rx * 0.92);
        const gy = Math.round(cy + (rnd() * 2 - 1) * ry * 0.80);
        g.clearRect(gx, gy, 1 + Math.round(rnd() * 2), 1 + Math.round(rnd()));
      }
    }
    if(crown.dots && cols.dot) crownDots(g, cx, cy, rx * 0.96, ry * 0.94, cols.dot, crown.dots, rnd);
    // emitters: three points inside the crown mass (2-3 per tree as specified)
    const sp = Math.max(4, Math.round(rx * 0.50));
    emitters.push({ x: bx, y: Math.round(cy - ry * 0.45), spread: sp });
    emitters.push({ x: bx - Math.round(rx * 0.60), y: Math.round(cy + ry * 0.18), spread: sp });
    emitters.push({ x: bx + Math.round(rx * 0.56), y: Math.round(cy + ry * 0.12), spread: sp });
    box = { x: Math.round(minX - PAD) - 2, y: Math.round(minY) - 3,
            w: Math.round(maxX - minX) + 5, h: Math.round(by - minY) + 5 };
    crownBox = { x: Math.round(cx - rx * 1.45 - PAD), y: Math.round(cy - ry * 1.45),
                 w: Math.round(rx * 2.9), h: Math.round(ry * 2.9) };
  }
  return { box, crownBox, emitters, snowPts };
}

/* draw every trunk of the city's tree species for one season */
function buildTree(s, season){
  const spec = s.city.tree;
  const info = { kind: spec ? spec.kind : null, layer: spec ? spec.layer : null,
                 season, drawn: false, bare: false, trunks: [], emitters: [], box: null, crownBox: null };
  s.treeInfo = info;
  s.treeEmitters = [];
  s.treeSnow = null;
  if(!spec) return info;
  const scale = s.BW / TREE_REF_W;
  const xs = Array.isArray(spec.x) ? spec.x : [spec.x];
  const hs = Array.isArray(spec.h) ? spec.h : [spec.h];
  const crown = spec.crowns[season] || spec.crowns.summer;
  const treeCol = s.pal.tree || { trunk: "#3b2a20", branch: "#5b4534", snow: "#e9f1f2" };
  const cols = treeCol[season] || treeCol.summer || treeCol.spring;
  const g = spec.layer === "mid" ? s.mid : s.near;
  const rnd = treeRnd(s.city.seed, season);
  const snowPts = [];
  const boxes = [], crownBoxes = [];
  for(let i = 0; i < xs.length; i++){
    const bx = Math.round(xs[i] * s.BW);
    const by = Math.round(spec.baseY * s.BH);
    const h = Math.round((hs[i] == null ? hs[0] : hs[i]) * scale);
    const one = drawOneTree(s, g, bx, by, h, scale, spec.form || {}, crown, cols, treeCol, rnd);
    boxes.push(one.box);
    if(one.crownBox) crownBoxes.push(one.crownBox);
    info.trunks.push({ x: bx, baseY: by, h, box: one.box });
    for(let k = 0; k < one.emitters.length; k++) info.emitters.push(one.emitters[k]);
    for(let k = 0; k < one.snowPts.length; k++) snowPts.push(one.snowPts[k]);
    // a tree standing at the waterline gets a reflection in the water pass
    if(spec.baseY <= 0.70 && one.box)
      s.props.push({ g: spec.layer, x: one.box.x + PAD, w: one.box.w,
                     h: Math.min(30, Math.round(one.box.h * 0.45)), col: cols.lo });
  }
  let ub = null, cb = null;
  for(let i = 0; i < boxes.length; i++) ub = unionBox(ub, boxes[i]);
  for(let i = 0; i < crownBoxes.length; i++) cb = unionBox(cb, crownBoxes[i]);
  info.box = ub;
  info.crownBox = cb || ub;
  info.bare = !!crown.bare;
  info.drawn = info.trunks.length > 0;
  info.emitters = info.emitters.slice();
  s.treeEmitters = info.emitters.slice();

  // baked settled snow for the bare crown, kept as its own small sprite
  if(crown.bare && snowPts.length && ub){
    const sn = makeCanvas(Math.max(4, Math.round(ub.w)), Math.max(4, Math.round(ub.h)));
    const sg = ctx2(sn);
    for(let i = 0; i < snowPts.length; i++){
      if(i % 3) continue;                 // a hint of snow, not blossom
      R(sg, snowPts[i][0] - (ub.x + PAD), snowPts[i][1] - ub.y,
        1 + ((i % 6) === 0 ? 1 : 0), 1, treeCol.snow);
    }
    s.treeSnow = { cv: sn, x: ub.x, y: ub.y, layer: spec.layer };
  }
  return info;
}

/* =========================================================================
   The garden: the one thing every city shares.  A little island in the
   near-left corner with a three-tier pagoda, two trees, a stone lantern and a
   path.  It is painted into the near layer at a fixed screen position, so it
   reads as the anchor and the city stays the backdrop.  It is deliberately
   season-blind: the pagoda island is the constant, the city tree is the season.
   ========================================================================= */
const GARDEN = {
  wall: "#efe7d2", wallShade: "#b9ad94", roof: "#8e3328", roofDark: "#5d2119",
  gold: "#d8b24a", wood: "#3f2c26", leaf: "#2f4a33", leafHi: "#436548",
  leafDark: "#1d2c22", earth: "#3a2f28", stone: "#8b948f", stoneDark: "#4b5452",
  lit: "#ffcf8a"
};

function gardenConifer(g, x, baseY, h){
  const half = Math.max(3, Math.round(h * 0.30));
  for(let r = 0; r < h; r++){
    const t = r / h;
    const w = Math.max(1, Math.round(half * t * 2));
    R(g, x - w / 2, baseY - r, w, 1, (r & 3) === 0 ? GARDEN.leafHi : GARDEN.leaf);
  }
  R(g, x - 1, baseY, 2, 3, GARDEN.wood);
}

function gardenCanopy(g, x, baseY, r){
  R(g, x, baseY - 9, 1, 9, GARDEN.wood);
  blob(g, x, baseY - 9 - Math.round(r * 0.75), r, Math.round(r * 0.8), GARDEN.leaf, GARDEN.leafHi);
  blob(g, x + 4, baseY - 9 - Math.round(r * 0.35), Math.round(r * 0.6), Math.round(r * 0.5), GARDEN.leafDark, null);
}

function gardenTier(s, g, x, yBase, bodyW, bodyH, eaveW){
  R(g, x, yBase - bodyH, bodyW, bodyH, GARDEN.wall);
  R(g, x, yBase - bodyH, 2, bodyH, GARDEN.wallShade);
  R(g, x + bodyW - 1, yBase - bodyH, 1, bodyH, GARDEN.wood);
  R(g, x + bodyW - 2, yBase - 2, 1, 2, GARDEN.wood);
  // dark shoji panels; the warm pixels are live, drawn only at night
  const winW = Math.max(2, Math.round(bodyW * 0.24));
  for(let i = 0; i < 2; i++)
    R(g, x + 4 + i * (bodyW - winW - 8), yBase - bodyH + 4, winW, bodyH - 7, GARDEN.wood);
  const ex = x + Math.round((bodyW - eaveW) / 2);
  R(g, ex, yBase - bodyH - 3, eaveW, 3, GARDEN.roof);
  R(g, ex, yBase - bodyH - 3, eaveW, 1, lighten(GARDEN.roof, 0.18));
  R(g, ex - 1, yBase - bodyH - 4, 3, 1, GARDEN.roofDark);
  R(g, ex + eaveW - 2, yBase - bodyH - 4, 3, 1, GARDEN.roofDark);
  R(g, ex - 1, yBase - bodyH - 3, 1, 3, GARDEN.roofDark);
  R(g, ex + eaveW, yBase - bodyH - 3, 1, 3, GARDEN.roofDark);
  R(g, ex + Math.round(eaveW / 2) - 1, yBase - bodyH - 3, 2, 1, GARDEN.gold);
  for(let i = 0; i < 2; i++)
    addWin(s, "near", x + 4 + i * (bodyW - winW - 8), yBase - bodyH + 4, winW, bodyH - 7, GARDEN.lit, 1.25);
}

function buildGarden(s){
  const g = s.near;
  const cx = Math.round(PAD + s.BW * 0.215);
  const base = s.BH + 6;                       // runs off the bottom of the frame
  const mound = 30;

  // a low, wet bank coming in from the left edge
  for(let x = -14; x < cx + 44; x++){
    const h = Math.round(9 + 3 * Math.sin(x * 0.055) + (x > cx ? 4 : 0));
    R(g, x, base - h, 1, h + 5, GARDEN.earth);
    R(g, x, base - h, 1, 1, GARDEN.leafDark);
    if((x & 7) === 0) R(g, x, base - h - 1, 1, 1, GARDEN.leaf);
  }
  // the island: rock at the waterline, moss above
  for(let r = 0; r < mound; r++){
    const t = r / (mound - 1);
    const halfW = Math.round(76 - 33 * Math.pow(t, 0.75));
    const col = r < 4 ? GARDEN.earth : (r % 9 === 3 ? GARDEN.leafHi : GARDEN.leaf);
    R(g, cx - halfW, base - r, halfW * 2, 1, col);
    if(r > 5 && r % 5 === 0) R(g, cx - halfW + 7, base - r, 3, 1, GARDEN.leafDark);
    if(r > 5 && r % 7 === 2) R(g, cx + halfW - 9, base - r, 2, 1, GARDEN.leafDark);
  }
  const topY = base - mound;

  gardenConifer(g, cx - 48, topY + 7, 34);
  gardenCanopy(g, cx + 44, topY + 6, 13);
  gardenCanopy(g, cx + 58, topY + 5, 9);

  // stone lantern
  R(g, cx - 27, topY - 4, 1, 5, GARDEN.stoneDark);
  R(g, cx - 29, topY - 7, 5, 3, GARDEN.stone);
  R(g, cx - 29, topY - 7, 5, 1, lighten(GARDEN.stone, 0.2));
  R(g, cx - 28, topY - 6, 3, 1, GARDEN.wood);
  addWin(s, "near", cx - 28, topY - 6, 3, 1, GARDEN.lit, 1.1);

  // path up from the left of the island
  for(let i = 0; i < 5; i++) R(g, cx - 54 + i * 5, topY + 12 - i * 2, 4, 1, GARDEN.stoneDark);

  // the pagoda itself: platform, three shrinking tiers, gold finial
  const px0 = cx - 13;
  R(g, px0 - 9, topY - 5, 44, 5, GARDEN.stone);
  R(g, px0 - 9, topY - 5, 44, 1, lighten(GARDEN.stone, 0.18));
  R(g, px0 - 9, topY - 1, 44, 1, GARDEN.stoneDark);
  gardenTier(s, g, px0, topY - 5, 26, 14, 40);
  gardenTier(s, g, px0 + 3, topY - 22, 20, 11, 32);
  gardenTier(s, g, px0 + 6, topY - 33, 14, 9, 24);
  R(g, px0 + 12, topY - 50, 2, 6, GARDEN.gold);
  R(g, px0 + 10, topY - 47, 6, 1, GARDEN.gold);
  R(g, px0 + 11, topY - 51, 4, 1, GARDEN.roofDark);
}
/* ------------------------------------------------------------ assemble one */
/* Baked once per (city, season, buffer size) and cached: the only things that
   are season-dependent are the tree crowns (near/mid layers) and the drift
   colours (a per-frame table lookup), so a season rollover is exactly one
   rebuild — the same cost as switching city. */
function buildScene(id, season){
  const city = cityRecord(id);
  const sea = season || state.season;
  if(scene && scene.id === city.id && scene.season === sea && scene.BW === BW && scene.BH === BH){
    bakeStats.hits++;
    return scene;
  }
  const rnd = mulberry32(city.seed);
  const LW = BW + PAD * 2;
  const farC = makeCanvas(LW, BH), midC = makeCanvas(LW, BH), nearC = makeCanvas(LW, BH);
  const pal = city.palette;
  const s = {
    id: city.id, city, pal, rnd, LW, BH, BW, PAD,
    season: sea,                                  // which crown this bake holds
    wcol: {
      hi: pal.waterHi || pal.canalHi || pal.lagoonHi,
      mid: pal.water || pal.canal || pal.lagoon,
      lo: pal.waterLo || pal.canalLo || pal.lagoonLo || pal.water
    },
    yW, cx: PAD + BW / 2,
    farC, midC, nearC,
    far: ctx2(farC), mid: ctx2(midC), near: ctx2(nearC),
    windows: [], props: [], lights: [], extra: {},
    treeInfo: null, treeEmitters: [], treeSnow: null
  };
  (BUILD[city.landmark] || BUILD.vancouver)(s);
  buildTree(s, sea);            // the seasonal source tree, on top of the landmark
  buildGarden(s);               // the constant island, drawn last so it anchors
  scene = s;
  bakeStats.scene++;
  bakeStats.near++;
  bakeStats.byCity[city.id] = (bakeStats.byCity[city.id] || 0) + 1;
  seedDrift(s.treeEmitters);    // put the pool under the new crown, not mid-air
  return s;
}

/* ----------------------------------------------------- sill dressing per city */
function buildSill(key){
  sillCv = null;
  const c = makeCanvas(BW, BH), g = ctx2(c);
  if(key === "amsterdam"){
    // a window box of tulips on the sill
    const bx = BW - 150, by = BH - 15;
    R(g, bx, by, 74, 11, "#3a2a22");
    R(g, bx, by, 74, 2, "#57402f");
    R(g, bx, by + 11, 74, 1, "#241812");
    const cols = ["#d24b6a", "#e8b23c", "#c85a9a", "#e2603f", "#d24b6a", "#e8b23c", "#c85a9a"];
    for(let i = 0; i < 11; i++){
      const tx = bx + 4 + i * 6.4;
      R(g, tx + 1, by - 7, 1, 7, "#3f5a35");
      R(g, tx, by - 11, 3, 3, "#4d6b46");
      R(g, tx + 1, by - 10, 1, 1, cols[i % cols.length]);
      R(g, tx, by - 9, 1, 1, cols[i % cols.length]);
      R(g, tx + 2, by - 9, 1, 1, "#e9ddc6");
    }
  } else if(key === "toronto"){
    // a couple of maple leaves blown onto the sill
    const bits = ["..#..", ".###.", "#####", ".###.", "..#.."];
    drawBits(g, bits, { "#": "#c07a2c" }, BW - 118, BH - 9);
    drawBits(g, bits, { "#": "#a8452a" }, BW - 104, BH - 7);
    drawBits(g, bits, { "#": "#d89a34" }, BW - 111, BH - 5);
  } else if(key === "hawaii"){
    const bits = [".###.", "#####", "#####", ".###."];
    drawBits(g, bits, { "#": "#e0576f" }, BW - 126, BH - 12);
    R(g, BW - 124, BH - 9, 1, 1, "#f2e6d0");
  } else if(key === "hongkong"){
    R(g, BW - 132, BH - 12, 8, 7, "#e0303a");
    R(g, BW - 132, BH - 12, 8, 1, "#ff6a4a");
    R(g, BW - 133, BH - 13, 10, 1, "#2b2320");
    R(g, BW - 129, BH - 5, 2, 2, "#d8a552");
  } else if(key === "vancouver"){
    // rain beads on the sill
    for(let i = 0; i < 7; i++) R(g, BW - 146 + i * 9, BH - 8 + (i % 2) * 2, 1, 1, "#9fc2c8");
  } else if(key === "sydney"){
    // a few jacaranda petals and a scrap of white sail
    drawBits(g, ["..#..", ".###.", "#####", ".###."], { "#": "#8b7fbd" }, BW - 138, BH - 13);
    drawBits(g, ["..#..", ".##..", "###..", "####."], { "#": "#f2efe3" }, BW - 124, BH - 12);
    R(g, BW - 121, BH - 8, 1, 1, "#cfc9b8");
  }
  sillCv = c;
}

/* =========================================================================
   Per-frame painting: sky, water, weather, lights, window frame.
   ========================================================================= */

function mixArr(a, b, t){
  const A = Array.isArray(a) ? a : rgbOf(a);
  const B = Array.isArray(b) ? b : rgbOf(b);
  return [lerp(A[0], B[0], t), lerp(A[1], B[1], t), lerp(A[2], B[2], t)];
}

/* --------------------------------------------------------------- sun / moon */
function sunPos(){
  const hour = state.hour;
  const elev = Math.sin(((hour - 6) / 24) * Math.PI * 2);
  if(elev > 0.01){
    const f = clamp((hour - 6) / 12, 0, 1);
    return { day: true, x: (0.07 + f * 0.86) * BW, y: yW * (0.94 - elev * 0.72),
             r: Math.max(3, Math.round(BW * 0.0125)), elev, glow: 6.0 };
  }
  const nf = ((hour - 18 + 24) % 24) / 12;
  const me = Math.sin(clamp(nf, 0, 1) * Math.PI);
  return { day: false, x: (0.07 + clamp(nf, 0, 1) * 0.86) * BW, y: yW * (0.94 - me * 0.72),
           r: Math.max(2, Math.round(BW * 0.0105)), elev: -me, glow: 4.4 };
}

/* --------------------------------------------------------------------- sky */
function paintSky(m){
  const g = ctx2(skyCv);
  g.clearRect(0, 0, BW, BH);
  const img = g.createImageData(BW, BH), d = img.data;
  const K = 14;
  const ramp = [];
  for(let k = 0; k < K; k++){
    const t = k / (K - 1);
    const r0 = lerp(m.top[0], m.bot[0], t);
    const g0 = lerp(m.top[1], m.bot[1], t);
    const b0 = lerp(m.top[2], m.bot[2], t);
    const lum = 0.299 * r0 + 0.587 * g0 + 0.114 * b0;
    const sat = 1.20, dim = 1 - 0.12 * (1 - t);      // push off the grey axis, deepen the zenith
    ramp.push([(lum + (r0 - lum) * sat) * dim, (lum + (g0 - lum) * sat) * dim, (lum + (b0 - lum) * sat) * dim]);
  }
  const hz = Math.max(1, yW);
  for(let y = 0; y < BH; y++){
    const t = Math.pow(clamp(y / hz, 0, 1), 1.1);
    let v = t * (K - 1);
    let i = Math.floor(v);
    let f = v - i;
    if(i >= K - 1){ i = K - 2; f = 1; }
    const rowOff = (y & 3) << 2;
    for(let x = 0; x < BW; x++){
      const idx = f > BAYER[rowOff | (x & 3)] / 16 ? i + 1 : i;
      const c = ramp[idx];
      const o = (y * BW + x) * 4;
      d[o] = c[0]; d[o + 1] = c[1]; d[o + 2] = c[2]; d[o + 3] = 255;
    }
  }

  // sun or moon, stippled with the same Bayer matrix so the halo is dithered
  const sp = sunPos();
  const light = sp.day ? [255, 238, 196] : [226, 238, 255];
  const core = sp.day ? [255, 250, 226] : [242, 247, 255];
  const R2 = sp.glow * sp.r;
  const x0 = Math.max(0, Math.floor(sp.x - R2)), x1 = Math.min(BW - 1, Math.ceil(sp.x + R2));
  const y0 = Math.max(0, Math.floor(sp.y - R2)), y1 = Math.min(BH - 1, Math.ceil(sp.y + R2));
  for(let y = y0; y <= y1; y++){
    const dy = y - sp.y;
    const rowOff = (y & 3) << 2;
    for(let x = x0; x <= x1; x++){
      const dx = x - sp.x;
      const dd = Math.sqrt(dx * dx + dy * dy);
      let a = 0;
      if(dd <= sp.r) a = 1;
      else {
        const q = 1 - (dd - sp.r) / (R2 - sp.r);
        a = q > 0 ? q * q * 0.55 : 0;
      }
      if(a < 0.03) continue;
      const o = (y * BW + x) * 4;
      if(a >= 0.999){
        d[o] = core[0]; d[o + 1] = core[1]; d[o + 2] = core[2];
      } else if(BAYER[rowOff | (x & 3)] / 16 < a){
        d[o]     = lerp(d[o], light[0], a * 0.8);
        d[o + 1] = lerp(d[o + 1], light[1], a * 0.8);
        d[o + 2] = lerp(d[o + 2], light[2], a * 0.8);
      }
    }
  }
  g.putImageData(img, 0, 0);
}

/* ------------------------------------------------------------------- water */
function paintWater(){
  const wc = scene.wcol;
  const h = Math.max(10, BH - yW);
  const c = makeCanvas(BW, h), g = ctx2(c);
  const img = g.createImageData(BW, h), d = img.data;
  const K = 9;
  const mid = mixArr(wc.mid, "#ffffff", 0.07);
  const ramp = [];
  for(let k = 0; k < K; k++){
    const t = k / (K - 1);
