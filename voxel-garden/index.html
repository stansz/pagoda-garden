<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voxel Pagoda Garden — relax</title>
<link rel="stylesheet" href="garden.css">
</head>
<body>
<canvas id="scene"></canvas>
<div id="hint">drag to look &middot; scroll to zoom &middot; enable sound for ambience</div>

<div id="places" hidden>
  <button data-place="0">Vancouver</button>
  <button data-place="1">Toronto</button>
  <button data-place="2">Hawai&lsquo;i</button>
  <button data-place="3">Hong Kong</button>
  <button data-place="4">Amsterdam</button>
  <button data-place="5">Sydney</button>
</div>

<div id="info">
  <div id="infoHead" role="button" tabindex="0" aria-expanded="false" title="Location, weather and time">
    <span id="infoPlace">Own time</span>
    <span id="infoClock">--:--</span>
    <button id="infoRefresh" aria-label="Refresh weather" title="Refresh weather now">&#8635;</button>
    <span class="chev" aria-hidden="true">&#9660;</span>
  </div>
  <div id="infoBody">
    <div class="row"><span id="infoCond">Clear sky</span><span id="infoTemp"></span></div>
    <div class="row muted" id="infoMeta"></div>
    <div class="ctl"><span class="lbl">city</span>
      <button id="place" aria-haspopup="true" aria-expanded="false" title="Change city">Vancouver</button></div>
    <div class="ctl"><span class="lbl">sound</span>
      <button id="snd" aria-pressed="false">sound</button>
      <input id="vol" type="range" min="0" max="1" step="0.01" value="0.18" aria-label="Volume"></div>
    <div class="ctl"><span class="lbl">zoom</span>
      <button id="zout" aria-label="Zoom out" title="Zoom out (scroll)">&minus;</button>
      <button id="zin" aria-label="Zoom in" title="Zoom in (scroll)">+</button></div>
  </div>
</div>

<a id="backCity" href="../" hidden>&larr; back to the city</a>

<script src="../shared/time.js"></script>
<script src="../shared/weather.js"></script>
<script src="../shared/audio.js"></script>
<script src="js/world.js"></script>
<script src="js/render.js"></script>
<script src="js/audio.js"></script>
<script src="js/ui.js"></script>
<script src="js/loop.js"></script>
</body>
</html>
