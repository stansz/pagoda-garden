name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  focus-timer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/check-focus.mjs
      - run: node tests/check-pages.mjs
      - run: node tests/check-plants.mjs
      - run: node tests/check-story.mjs
      - run: node tests/check-walk.mjs
